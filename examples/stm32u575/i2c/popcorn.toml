[project]
name = "i2c-eeprom"

[mcu]
part = "STM32U575QGIx"

[image.app]
elf = "prebuilt/i2c_eeprom.elf"

[boot]
until = "main"
budget = 1_000_000

[board.I2C1]
devices = [{ address = 0x50, model = "popcorn.devices:Eeprom24xx", write_cycle = "5 ms" }]

[configs.slow-eeprom]
board.I2C1.devices = [{ address = 0x50, model = "popcorn.devices:Eeprom24xx", write_cycle = "10 ms" }]

[configs.scripted]
board.I2C1.devices = [
  { address = 0x50, model = "popcorn.devices:TableTarget", register_bytes = 2, replies = { "0x0100" = [0xC0, 0xC1, 0xC2, 0xC3, 0xC4, 0xC5, 0xC6, 0xC7, 0xC8, 0xC9, 0xCA, 0xCB, 0xCC, 0xCD, 0xCE, 0xCF, 0xD0, 0xD1, 0xD2, 0xD3, 0xD4, 0xD5, 0xD6, 0xD7, 0xD8, 0xD9, 0xDA, 0xDB, 0xDC, 0xDD, 0xDE, 0xDF] } },
]

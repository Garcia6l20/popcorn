format = 1
rzone = "STM32_DIE484_640_2048.xml"

[core]
fpu_double = false
dsp = true
trustzone = true
mpu_regions = 8
mpu_regions_secure = 12
sau_regions = 8
num_interrupts = 131
source = "DS14121 rev 5, 3.1: Cortex-M33 with TrustZone, a single-precision FPU and a full set of DSP instructions. RM0481 rev 5, 2.2 and 7 (system security): MPU of eight regions in nonsecure state and twelve in TrustZone, so 8 nonsecure and 12 secure. RM0481 2.2: up to eight SAU configurable regions. RM0481 17.3 table 152: STM32H562/563/573xx vector positions 0 to 130, LPTIM6 last at position 130, so 131 lines. Table 152 note 1 marks AES as absent on STM32H562/563 and note 2 marks FDCAN2 as absent on STM32H562, both present on the STM32H573"

[[regions]]
name = "Flash_NS"
start = 0x08000000
size = 0x00200000
kind = "rom"
acc = { read = true, write = false, execute = true }
secure = false
source = "RM0481 rev 5, 2.3.2 figure 2: nonsecure FLASH at 0x0800 0000 to 0x0820 0000 in the code region. DS14121 rev 5, ordering information: I = 2 Mbytes. RM0481 7.3.5 to 7.3.8: flash is written through the FLASH interface program and erase sequences, not by a plain store"

[[regions]]
name = "HIGH_CYCLE_FLASH_NS"
start = 0x09000000
size = 0x00018000
kind = "rom"
acc = { read = true, write = false, execute = false }
secure = false
source = "RM0481 rev 5, 2.3.2 figure 2: nonsecure flash high-cycle data at 0x0900 0000 to 0x0901 8000. 7.3.10: up to 96 Kbytes at 0x0900 0000 to 0x0901 7FFF, accessed through the AHB system port, written through the FLASH interface. Execute is denied: 7.3.10 lists an instruction fetch from the high-cycle data area as a bus error"

[[regions]]
name = "RAM_C_NS"
start = 0x0A000000
size = 0x000A0000
kind = "ram"
acc = { read = true, write = true, execute = true }
secure = false
physical = 0x20000000
source = "RM0481 rev 5, 2.3.2 figure 2: nonsecure SRAM1 at 0x0A00 0000, SRAM2 at 0x0A04 0000 and SRAM3 at 0x0A05 0000 to 0x0A0A 0000 in the code region. 2.1.1: the fast C-bus maps the SRAMs in the code region, the SRAM at 0x2000 0000. 2.3.3: SRAM1 256 Kbytes, SRAM2 64 Kbytes, SRAM3 320 Kbytes. DS14121 rev 5, 1: 640 Kbytes of SRAM"

[[regions]]
name = "Flash_S"
start = 0x0C000000
size = 0x00200000
kind = "rom"
acc = { read = true, write = false, execute = true }
secure = true
physical = 0x08000000
source = "RM0481 rev 5, 2.3.2 figure 2: secure FLASH alias at 0x0C00 0000 to 0x0C20 0000. 2.2: flash memory is aliased for secure and nonsecure states. DS14121 rev 5, ordering information: I = 2 Mbytes"

[[regions]]
name = "HIGH_CYCLE_FLASH_S"
start = 0x0D000000
size = 0x00018000
kind = "rom"
acc = { read = true, write = false, execute = false }
secure = true
physical = 0x09000000
source = "RM0481 rev 5, 2.3.2 figure 2: secure flash high-cycle data alias at 0x0D00 0000 to 0x0D01 8000. 2.2: flash memory is aliased for secure and nonsecure states. 7.3.10: 96 Kbytes at most"

[[regions]]
name = "RAM_C_S"
start = 0x0E000000
size = 0x000A0000
kind = "ram"
acc = { read = true, write = true, execute = true }
secure = true
physical = 0x20000000
source = "RM0481 rev 5, 2.3.2 figure 2: secure SRAM1 at 0x0E00 0000, SRAM2 at 0x0E04 0000 and SRAM3 at 0x0E05 0000 to 0x0E0A 0000 in the code region. 2.2: system SRAMs are aliased for secure and nonsecure states. 2.1.1: the code-region mapping of the SRAM at 0x2000 0000"

[[regions]]
name = "SRAM_NS"
start = 0x20000000
size = 0x000A0000
kind = "ram"
acc = { read = true, write = true, execute = true }
secure = false
source = "RM0481 rev 5, 2.3.2 figure 2: nonsecure SRAM1, SRAM2 and SRAM3 at 0x2000 0000 to 0x200A 0000. 2.3.3: 256 + 64 + 320 Kbytes. DS14121 rev 5, 1: 640 Kbytes of SRAM. ARMv8-M ARM B8.1: the SRAM region 0x2000 0000 to 0x3FFF FFFF is executable"

[[regions]]
name = "SRAM_S"
start = 0x30000000
size = 0x000A0000
kind = "ram"
acc = { read = true, write = true, execute = true }
secure = true
physical = 0x20000000
source = "RM0481 rev 5, 2.3.2 figure 2: secure SRAM1, SRAM2 and SRAM3 at 0x3000 0000 to 0x300A 0000. 2.2: system SRAMs are aliased for secure and nonsecure states"

[[regions]]
name = "BKPSRAM_NS"
start = 0x40036400
size = 0x00001000
kind = "ram"
acc = { read = true, write = true, execute = false }
secure = false
source = "RM0481 rev 5, 2.3.2 table 5: the backup SRAM window starts at 0x4003 6400. 2.3.3: the STM32H562/563/573xx devices have a 4-Kbyte BKPSRAM with ECC, which ends the window at 0x4003 73FF as the GTZC1 MPC_WM_BKPRAM row lists it. DS14121 rev 5, 1: 4 Kbytes of backup SRAM. ARMv8-M ARM B8.1: the peripheral region 0x4000 0000 to 0x5FFF FFFF is execute-never"

[[regions]]
name = "BKPSRAM_S"
start = 0x50036400
size = 0x00001000
kind = "ram"
acc = { read = true, write = true, execute = false }
secure = true
physical = 0x40036400
source = "RM0481 rev 5, 2.3.2 table 5: secure backup SRAM window starts at 0x5003 6400. 2.2: peripherals are aliased for secure and nonsecure states. 2.3.3: 4 Kbytes, ending at 0x5003 73FF. ARMv8-M ARM B8.1: the peripheral region is execute-never"

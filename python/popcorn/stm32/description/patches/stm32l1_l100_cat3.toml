format = 1
source = "STM32L100RCTx, the one value line Cat.3 part: CubeMX lists no TIM5 and no operational amplifier for it, SPI3 is line 47, address 0x0000_00FC (RM0038 Rev 18, Table 50)"

[match]
parts = ["STM32L100*"]
svd = ["STM32L100.svd"]
dies = ["DIE427"]

[peripherals]
drop = ["TIM5", "OPAMP"]
source = "The CubeMX part STM32L100RCTx has no TIM5 and no OPAMP IP, the L100 SVD lists both. RM0038 Rev 18, 1.4: the operational amplifiers belong to the STM32L15x and STM32L16x Cat.3 devices"

[irqs]
drop = ["TIM5", "SPI3"]
add = [{ number = 47, name = "SPI3", peripheral = "SPI3" }]

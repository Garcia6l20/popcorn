format = 1
source = "RM0038 Rev 18 Cat.3 on DIE427, 256 KB flash: no FSMC and no SDIO, DBGMCU_IDCODE, the FLASH version of Cat.3, the factory information block and the CMSIS header suffix"

[match]
parts = ["STM32L1*"]
svd = ["STM32L1*.svd"]
dies = ["DIE427"]
flash_kib = [256]

[peripherals]
drop = ["FSMC", "SDIO"]
source = "RM0038 Rev 18, 3.1 and Table 50 (Cat.3 vector table): Cat.3 has no FSMC and no SDIO, the SVDs list them"

[irqs]
drop = ["SDIO"]

[cmsis]
suffix = "xc"
source = "stm32l100xc.h, stm32l151xc.h, stm32l152xc.h and stm32l162xc.h are the CMSIS device headers of the Cat.3 devices on DIE427"

[[resets]]
peripheral = "DBGMCU"
register = "IDCODE"
reset = 0x10000427
source = "RM0038 Rev 18, 30.6.1 MCU device ID code: DEV_ID[11:0] is 0x427 for Cat.3 on DIE427, REV_ID[15:0] 0x1000 is revision A of every category. One modelled revision"

[ip]
versions = { "FLASH" = "STM32L1_flash_cat3" }
source = "RM0038 Rev 18, Cat.3 flash interface. FLASH has no CubeMX version, the empty version is replaced"

[signature]
source = "RM0038 Rev 18, 31.1.1 and 31.2, Cat.3 to Cat.6: F_SIZE at 0x1FF800CC, U_ID(31:0) at 0x1FF800D0, U_ID(63:32) at 0x1FF800D4 and U_ID(95:64) at 0x1FF800E4. The ID words are fixed values: wafer coordinates 0x00320014, wafer 1, lot POPCORN in ASCII. RM0038 has no package register"
region = "OPTION_FACTORY"
uid = 0xD0
flash_size = 0xCC
uid_words = [0x0032_0014, 0x4F52_4E01, 0x504F_5043]
uid_offsets = [0, 4, 0x14]

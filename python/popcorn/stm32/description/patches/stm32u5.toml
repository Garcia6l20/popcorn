format = 1
source = "I05 section 5: SVD peripheral naming vs CubeMX db IP instances, STM32U575QGIx"

[match]
parts = ["STM32U5*"]
svd = ["STM32U5*.svd"]

[peripherals]
drop = ["DCB"]
source = "Armv8-M Architecture Reference Manual (DDI 0553), D1.2: the System Control Space, 0xE000E000 to 0xE000EFFF, holds the core-private DCB (DSCSR at 0xE000EE08) and is modelled by the Cortex-M arch module, not as a peripheral. DBGMCU at 0xE0044000 is outside the SCS and stays"

[aliases]
prefix = "SEC_"
offset = 0x10000000
source = "I05 section 1: SEC_ prefix at NS base + 0x1000_0000, true on U5"

[ip]
renames = { USB_OTG_FS = ["OTG_FS"], DCACHE1 = ["DCACHE"], ICACHE = ["ICache"], COMP1 = ["COMP"], COMP2 = ["COMP"], OPAMP1 = ["OPAMP"], OPAMP2 = ["OPAMP"], GPIO = ["GPIOA", "GPIOB", "GPIOC", "GPIOD", "GPIOE", "GPIOF", "GPIOG", "GPIOH", "GPIOI", "LPGPIO1"], GTZC = ["GTZC1_TZSC", "GTZC1_TZIC"], GTZC_NS = ["GTZC1_MPCBB1", "GTZC1_MPCBB2", "GTZC1_MPCBB3"], GTZC_S = ["GTZC2_TZSC", "GTZC2_TZIC", "GTZC2_MPCBB4"], SYS = ["SYSCFG"] }

[irqs]
add = [{ number = 27, name = "IWDG", peripheral = "IWDG" }]

[core]
reset_clock_hz = 4_000_000
source = "RM0456 rev 6, 11.4: MSIS at 4 MHz is SYSCLK out of reset"

[[fields]]
instances = ["ADC1", "ADC4"]
registers = ["ADC_ISR"]
fields = ["ADRDY", "EOSMP", "EOC", "EOS", "OVR", "AWD1", "AWD2", "AWD3"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 33.6.1 (ADC1/ADC12) and 34.7.1 (ADC4) ADC interrupt and status register (ADC_ISR): ADRDY..AWD3 rc_w1 at the same bit positions in both chapters. instances, not ip = \"ADC\": the db-less ADC12 common block falls back to ip = group name \"ADC\" too and has no ADC_ISR register of its own"

[[fields]]
instances = ["ADC1"]
registers = ["ADC_ISR"]
fields = ["JEOC", "JEOS"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 33.6.1 ADC interrupt and status register (ADC_ISR): injected-channel flags, ADC1 only, ADC4 has no injected group"

[[fields]]
instances = ["ADC4"]
registers = ["ADC_ISR"]
fields = ["EOCAL", "LDORDY"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 34.7.1 ADC interrupt and status register (ADC_ISR): EOCAL and LDORDY are rc_w1 on ADC4, unlike ADC1/ADC12 (33.6.1) where LDORDY is plain r and EOCAL does not exist"

[[fields]]
instances = ["EXTI"]
registers = ["EXTI_RPR1"]
fields = ["RPIF0", "RPIF1", "RPIF2", "RPIF3", "RPIF4", "RPIF5", "RPIF6", "RPIF7", "RPIF8", "RPIF9", "RPIF10", "RPIF11", "RPIF12", "RPIF13", "RPIF14", "RPIF15", "RPIF16", "RPIF17", "RPIF18", "RPIF19", "RPIF20", "RPIF21", "RPIF22", "RPIF23", "RPIF24", "RPIF25"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 23.6.4 EXTI rising edge pending register (EXTI_RPR1), all bits rc_w1"

[[fields]]
instances = ["EXTI"]
registers = ["EXTI_FPR1"]
fields = ["FPIF0", "FPIF1", "FPIF2", "FPIF3", "FPIF4", "FPIF5", "FPIF6", "FPIF7", "FPIF8", "FPIF9", "FPIF10", "FPIF11", "FPIF12", "FPIF13", "FPIF14", "FPIF15", "FPIF16", "FPIF17", "FPIF18", "FPIF19", "FPIF20", "FPIF21", "FPIF22", "FPIF23", "FPIF24", "FPIF25"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 23.6.5 EXTI falling edge pending register (EXTI_FPR1), all bits rc_w1"

[[fields]]
instances = ["FLASH"]
registers = ["FLASH_NSSR"]
fields = ["EOP", "OPERR", "PROGERR", "WRPERR", "PGAERR", "SIZERR", "PGSERR", "OPTWERR"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 7.9.7 FLASH nonsecure status register (FLASH_NSSR), all listed bits rc_w1"

[[fields]]
instances = ["FLASH"]
registers = ["FLASH_SECSR"]
fields = ["EOP", "OPERR", "PROGERR", "WRPERR", "PGAERR", "SIZERR", "PGSERR"]
on_write = "one_to_clear"
source = "RM0456 rev 6, 7.9.8 FLASH secure status register (FLASH_SECSR), all listed bits rc_w1; RDERR (SVD bit 14) is not documented in this RM revision and is left unpatched"

[[fields]]
ip = "I2C"
registers = ["ISR"]
fields = ["TXIS", "TXE"]
on_write = "one_to_set"
source = "RM0456 rev 6, 65.9.7 I2C interrupt and status register (I2C_ISR): TXIS/TXE are rs, software sets them to force a transmit event or flush TXDR, not a clear"

[[fields]]
instances = ["TIM1", "TIM8"]
registers = ["TIM1_SR"]
fields = ["UIF", "CC1IF", "CC2IF", "CC3IF", "CC4IF", "COMIF", "TIF", "BIF", "B2IF", "CC1OF", "CC2OF", "CC3OF", "CC4OF", "SBIF", "CC5IF", "CC6IF", "IDXF", "DIRF", "IERRF", "TERRF"]
on_write = "zero_to_clear"
source = "RM0456 rev 6, 54.6.5 TIMx status register (TIMx_SR)(x = 1, 8): every field rc_w0, all 20 SVD fields listed; the SVD names this register TIM1_SR on both TIM1 and TIM8. HAL clears a flag by writing TIMx->SR = ~flag, which writes 1 (no effect on rc_w0) to every other bit, so a field left as the default modify would be wrongly set"

[[fields]]
instances = ["TIM2", "TIM3", "TIM4", "TIM5"]
registers = ["SR"]
fields = ["UIF", "CC1IF", "CC2IF", "CC3IF", "CC4IF", "TIF", "CC1OF", "CC2OF", "CC3OF", "CC4OF", "IDXF", "DIRF", "IERRF", "TERRF"]
on_write = "zero_to_clear"
source = "RM0456 rev 6, 55.5.5 TIMx status register (TIMx_SR)(x = 2 to 5): every field rc_w0, all 14 SVD fields listed. Same HAL SR = ~flag concern as the TIM1/TIM8 rule above"

[[fields]]
instances = ["TIM15"]
registers = ["SR"]
fields = ["UIF", "CC1IF", "CC2IF", "COMIF", "TIF", "BIF", "CC1OF", "CC2OF"]
on_write = "zero_to_clear"
source = "RM0456 rev 6, 56.7.5 TIM15 status register (TIM15_SR): every field rc_w0, all 8 SVD fields listed. Same HAL SR = ~flag concern as the TIM1/TIM8 rule above"

[[fields]]
instances = ["TIM16", "TIM17"]
registers = ["SR"]
fields = ["UIF", "CC1IF", "COMIF", "BIF", "CC1OF"]
on_write = "zero_to_clear"
source = "RM0456 rev 6, 56.8.4 TIMx status register (TIMx_SR)(x = 16, 17): every field rc_w0, all 5 SVD fields listed. Same HAL SR = ~flag concern as the TIM1/TIM8 rule above"

[[cross]]
ip = "GPDMA"
reg = "GPDMA_C{n}FCR"
target_reg = "GPDMA_C{n}SR"
each = { n = [0, 15] }
effect = "clear"
pairs = { TCF = "TCF", HTF = "HTF", DTEF = "DTEF", ULEF = "ULEF", USEF = "USEF", SUSPF = "SUSPF", TOF = "TOF" }
source = "RM0456 rev 6, 17.8.7/17.8.8 GPDMA channel x flag clear register / status register, one shared layout for all 16 channels"

[[cross]]
ip = "I2C"
reg = "ICR"
target_reg = "ISR"
effect = "clear"
pairs = { ALERTCF = "ALERT", TIMOUTCF = "TIMEOUT", PECCF = "PECERR", OVRCF = "OVR", ARLOCF = "ARLO", BERRCF = "BERR", STOPCF = "STOPF", NACKCF = "NACKF", ADDRCF = "ADDR" }
source = "RM0456 rev 6, 65.9.7/65.9.8 I2C interrupt and status register (I2C_ISR) / I2C interrupt clear register (I2C_ICR)"

[[cross]]
instances = ["RCC"]
reg = "RCC_CICR"
target_reg = "RCC_CIFR"
effect = "clear"
pairs = { LSIRDYC = "LSIRDYF", LSERDYC = "LSERDYF", MSISRDYC = "MSISRDYF", HSIRDYC = "HSIRDYF", HSERDYC = "HSERDYF", HSI48RDYC = "HSI48RDYF", PLL1RDYC = "PLL1RDYF", PLL2RDYC = "PLL2RDYF", PLL3RDYC = "PLL3RDYF", CSSC = "CSSF", MSIKRDYC = "MSIKRDYF", SHSIRDYC = "SHSIRDYF" }
source = "RM0456 rev 6, 11.8.19/11.8.20 RCC clock interrupt flag register (RCC_CIFR) / RCC clock interrupt clear register (RCC_CICR)"

[[cross]]
instances = ["RTC"]
reg = "SCR"
target_reg = "SR"
effect = "clear"
pairs = { CALRAF = "ALRAF", CALRBF = "ALRBF", CWUTF = "WUTF", CTSF = "TSF", CTSOVF = "TSOVF", CITSF = "ITSF", CSSRUF = "SSRUF" }
source = "RM0456 rev 6, 63.6.20/63.6.23 RTC status register (RTC_SR) / RTC status clear register (RTC_SCR)"

[[cross]]
ip = "SAI"
reg = "ACLRFR"
target_reg = "ASR"
effect = "clear"
pairs = { CLFSDET = "LFSDET", CAFSDET = "AFSDET", CCNRDY = "CNRDY", CWCKCFG = "WCKCFG", CMUTEDET = "MUTEDET", COVRUDR = "OVRUDR" }
source = "RM0456 rev 6, 69.6.8 SAI clear flag register (SAI_ACLRFR), sub-block A"

[[cross]]
ip = "SAI"
reg = "BCLRFR"
target_reg = "BSR"
effect = "clear"
pairs = { CLFSDET = "LFSDET", CAFSDET = "AFSDET", CCNRDY = "CNRDY", CWCKCFG = "WCKCFG", CMUTEDET = "MUTEDET", COVRUDR = "OVRUDR" }
source = "RM0456 rev 6, 69.6.16 SAI clear flag register (SAI_BCLRFR), sub-block B"

[[cross]]
ip = "SPI"
reg = "SPI_IFCR"
target_reg = "SPI_SR"
effect = "clear"
pairs = { SUSPC = "SUSP", MODFC = "MODF", TIFREC = "TIFRE", CRCEC = "CRCE", OVRC = "OVR", UDRC = "UDR", TXTFC = "TXTF", EOTC = "EOT" }
source = "RM0456 rev 6, 68.8.7 SPI interrupt/status flags clear register (SPI_IFCR)"

[[cross]]
ip = "USART"
reg = "ICR"
target_reg = "ISR_enabled"
effect = "clear"
pairs = { CMCF = "CMF", EOBCF = "EOBF", RTOCF = "RTOF", CTSCF = "CTSIF", LBDCF = "LBDF", TCBGTCF = "TCBGT", TCCF = "TC", TXFECF = "TXFE", IDLECF = "IDLE", ORECF = "ORE", NECF = "NE", FECF = "FE", PECF = "PE" }
source = "RM0456 rev 6, 66.8.10/66.8.12 USART interrupt and status register (USART_ISR) / USART interrupt flag clear register (USART_ICR); ISR_enabled is the storage owner the SVD's ISR_disabled alternate view points at. UDRCF is omitted: RM 66.8.10 places UDR at bit 13 of the FIFO-enabled ISR view, but the STM32U575 SVD's ISR_enabled register (the FIFO-enabled view) does not declare a UDR field at all, an ST SVD omission"

[[cross]]
ip = "UART"
reg = "ICR"
target_reg = "ISR_enabled"
effect = "clear"
pairs = { CMCF = "CMF", EOBCF = "EOBF", RTOCF = "RTOF", CTSCF = "CTSIF", LBDCF = "LBDF", TCBGTCF = "TCBGT", TCCF = "TC", TXFECF = "TXFE", IDLECF = "IDLE", ORECF = "ORE", NECF = "NE", FECF = "FE", PECF = "PE" }
source = "RM0456 rev 6, 66.8.10/66.8.12, the same shared USART/UART chapter as the USART-keyed rule above; UART4/UART5 are a different db IP (UART, not USART) with a register-for-register identical ISR/ICR layout, confirmed against the real SVD. UDRCF omitted: RM 66.8.12 states this bit is reserved when the instance does not support SPI slave mode, which UART4/UART5 do not"

[[cross]]
ip = "LPUART"
reg = "ICR"
target_reg = "ISR"
effect = "clear"
pairs = { CMCF = "CMF", CTSCF = "CTSIF", TCCF = "TC", IDLECF = "IDLE", ORECF = "ORE", NECF = "NE", FECF = "FE", PECF = "PE" }
source = "RM0456 rev 6, 67.7.8 LPUART interrupt and status register (LPUART_ISR) / 67.7.10 LPUART interrupt flag clear register (LPUART_ICR): a reduced 8-field set versus USART_ICR (LPUART has a FIFO, but no LIN, smartcard, SPI-slave or receiver-timeout support); LPUART1's SVD register is a single ISR, no enabled/disabled alternate split"

[[cross]]
instances = ["UCPD1"]
reg = "UCPD_ICR"
target_reg = "UCPD_SR"
effect = "clear"
pairs = { FRSEVTCF = "FRSEVT", TYPECEVT2CF = "TYPECEVT2", TYPECEVT1CF = "TYPECEVT1", RXMSGENDCF = "RXMSGEND", RXOVRCF = "RXOVR", RXHRSTDETCF = "RXHRSTDET", RXORDDETCF = "RXORDDET", TXUNDCF = "TXUND", HRSTSENTCF = "HRSTSENT", HRSTDISCCF = "HRSTDISC", TXMSGABTCF = "TXMSGABT", TXMSGSENTCF = "TXMSGSENT", TXMSGDISCCF = "TXMSGDISC" }
source = "RM0456 rev 6, 74.8.6/74.8.7 UCPD status register (UCPD_SR) / UCPD interrupt clear register (UCPD_ICR)"

[[registers]]
peripheral = "RNG"
name = "NSCR"
offset = 0x0C
width = 32
reset = 0x0003FFFF
acc = "read_write"
fields = [
  { name = "EN_OSC6", lsb = 15, width = 3 },
  { name = "EN_OSC5", lsb = 12, width = 3 },
  { name = "EN_OSC4", lsb = 9, width = 3 },
  { name = "EN_OSC3", lsb = 6, width = 3 },
  { name = "EN_OSC2", lsb = 3, width = 3 },
  { name = "EN_OSC1", lsb = 0, width = 3 },
]
source = "RM0456 rev 6, 48.7.4 RNG noise source control register (RNG_NSCR): offset 0x00C, reset 0x0003FFFF, EN_OSC1 to EN_OSC6 rw in bits 17:0, bits 31:18 reserved. ST's STM32U575 SVD omits it, and HAL_RNG_Init writes it. Plain storage: the CONDRST and CONFIGLOCK write gating is not modelled"

[[registers]]
peripheral = "OTG_FS"
name = "GSNPSID"
offset = 0x40
width = 32
reset = 0x4F54310A
acc = "read_only"
fields = []
source = "CMSIS stm32u575xx.h USB_OTG_GlobalTypeDef places GSNPSID at 0x040 and GHWCFG1 to GHWCFG3 at 0x044 to 0x04C, and HAL stm32u5xx_ll_usb.h:341-342 defines USB_OTG_CORE_ID_310A 0x4F54310A, the core ID the U5 HAL compares GSNPSID with. RM0456 rev 6 72.15 leaves 0x040 to 0x050 undocumented and ST's STM32U575 SVD omits them. Drivers read GSNPSID to pick the core revision, tinyusb's dwc2 refuses a core whose ID is not 0x4F54xxxx"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG1"
offset = 0x44
width = 32
reset = 0x00000000
acc = "read_only"
fields = []
source = "CMSIS stm32u575xx.h USB_OTG_GlobalTypeDef places GHWCFG1 to GHWCFG3 at 0x044 to 0x04C, RM0456 rev 6 72.15 leaves them undocumented and ST's STM32U575 SVD omits them. Read as 0, no U575 reference value: on STM32, tinyusb takes the FIFO size and endpoint count from its static dwc2_stm32.h table and reads GHWCFG2 only on USB traffic"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG2"
offset = 0x48
width = 32
reset = 0x00000000
acc = "read_only"
fields = []
source = "CMSIS stm32u575xx.h USB_OTG_GlobalTypeDef places GHWCFG1 to GHWCFG3 at 0x044 to 0x04C, RM0456 rev 6 72.15 leaves them undocumented and ST's STM32U575 SVD omits them. Read as 0, no U575 reference value: on STM32, tinyusb takes the FIFO size and endpoint count from its static dwc2_stm32.h table and reads GHWCFG2 only on USB traffic"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG3"
offset = 0x4C
width = 32
reset = 0x00000000
acc = "read_only"
fields = []
source = "CMSIS stm32u575xx.h USB_OTG_GlobalTypeDef places GHWCFG1 to GHWCFG3 at 0x044 to 0x04C, RM0456 rev 6 72.15 leaves them undocumented and ST's STM32U575 SVD omits them. Read as 0, no U575 reference value: on STM32, tinyusb takes the FIFO size and endpoint count from its static dwc2_stm32.h table and reads GHWCFG2 only on USB traffic"


[memory]
source = "RM0456 rev 6, 7.3.1 Tables 51 to 53: the 512-byte OTP area at 0x0BFA0000 in the nonsecure information block, its alias at 0x0FFA0000 in the secure information block. 7.2: OTP data cannot be erased and is written once, through the flash interface, so a CPU store is refused. Each region is 1 KB, the emulator's page granularity: the 512 bytes past the OTP area read as erased instead of faulting. RM0456 rev 6, 7.3.7: flash is programmed by 32-bit stores into the main memory range while FLASH_NSCR.PG is set, and erased through FLASH_NSCR, so the FLASH interface serves stores into both flash windows. The OTP regions get no controller: OTP programming is not modelled"
controller = { Flash_NS = "FLASH", Flash_S = "FLASH" }
add = [
  { name = "OTP_NS", start = 0x0BFA0000, size = 0x400, kind = "rom", acc = { read = true, write = false, execute = false }, secure = false },
  { name = "OTP_S", start = 0x0FFA0000, size = 0x400, kind = "rom", acc = { read = true, write = false, execute = false }, secure = true, physical = 0x0BFA0000 },
  { name = "SIG_NS", start = 0x0BFA0400, size = 0x400, kind = "rom", acc = { read = true, write = false, execute = false }, secure = false },
  { name = "SIG_S", start = 0x0FFA0400, size = 0x400, kind = "rom", acc = { read = true, write = false, execute = false }, secure = true, physical = 0x0BFA0400 },
]

[signature]
source = "RM0456 rev 6, chapter 76 device electronic signature, in the system memory page SIG_NS at 0x0BFA0400: 76.3 package data register at 0x0BFA0500, PKG[4:0] from the table of 76.3 keyed by the CubeMX package, DSI when the part has DSIHOST, SMPS for a part name ending in Q; a package absent from that table leaves the register erased, which LL_GetPackageType reads as 0x1F, WLCSP150 SMPS: wrong for the UFQFPN48 and UFBGA64 SMPS parts. 76.1 unique device ID at 0x0BFA0700, 96 bits, here a fixed value: wafer coordinates 0x00320014, wafer 1, lot POPCORN in ASCII. 76.2 flash size data register at 0x0BFA07A0, FLASH_SIZE in KB from the CubeMX part. SIG_S is the same page in the secure information block, as OTP_S"
region = "SIG_NS"
package = 0x100
uid = 0x300
flash_size = 0x3A0
uid_words = [0x0032_0014, 0x4F52_4E01, 0x504F_5043]
packages = { "LQFP64" = 0x00, "WLCSP72 SMPS" = 0x01, "LQFP100" = 0x02, "UFBGA132" = 0x03, "LQFP144" = 0x04, "LQFP48" = 0x05, "UFBGA169" = 0x07, "TFBGA169" = 0x07, "LQFP64 SMPS" = 0x08, "WLCSP90 SMPS" = 0x09, "LQFP100 SMPS" = 0x0A, "UFBGA132 SMPS" = 0x0B, "LQFP144 SMPS" = 0x0C, "LQFP48 SMPS" = 0x0D, "UFBGA169 SMPS" = 0x0F, "TFBGA169 SMPS" = 0x0F, "UFBGA64" = 0x12, "UFBGA100" = 0x13, "LQFP100 DSI SMPS" = 0x14, "LQFP144 DSI SMPS" = 0x15, "UFBGA144 DSI SMPS" = 0x19, "WLCSP208 DSI SMPS" = 0x1B, "TFBGA216 DSI SMPS" = 0x1C, "UFBGA100 SMPS" = 0x1D, "WLCSP56 SMPS" = 0x1E, "WLCSP150 SMPS" = 0x1F, "WLCSP150 DSI SMPS" = 0x1F }

format = 1
source = "PWR_SCCR reset of the STM32H563 and STM32H573 packages that use the SMPS regulator, the RefNames ending in Q. RM0481 Rev 5, 10.11.11: reset 0x0000 0X00 on STM32H562/563/573, hardware sets SMPSEN (bit 9) when the package uses the SMPS and LDOEN (bit 8) when it uses the LDO, the two bits exclusive. The SVDs give 0"

[match]
parts = ["STM32H563*xQ", "STM32H573*xQ"]

[[resets]]
peripheral = "PWR"
register = "PWR_SCCR"
reset = 0x200
source = "RM0481 Rev 5, 10.11.11 PWR supply configuration control register (PWR_SCCR): SMPSEN is set by hardware when the package uses the SMPS regulator. The SVDs give 0"

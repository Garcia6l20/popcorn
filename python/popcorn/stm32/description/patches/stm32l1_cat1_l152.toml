format = 1
source = "RM0038 Rev 18, 6.3.4 and 6.3.14: the CSS on LSE bits are available in Cat.2 to Cat.6 only. The STM32L152 SVD lists them for every category"

[match]
parts = ["STM32L1*"]
svd = ["STM32L152.svd"]
dies = ["DIE416"]

[[fields]]
instances = ["RCC"]
registers = ["CIR"]
fields = ["LSECSSIE", "LSECSSC"]
drop = true
source = "RM0038 Rev 18, 6.3.4 RCC_CIR: LSECSSIE and LSECSSC are available in Cat.2 to Cat.6 only"

[[fields]]
instances = ["RCC"]
registers = ["CSR"]
fields = ["LSECSSON", "LSECSSD"]
drop = true
source = "RM0038 Rev 18, 6.3.14 RCC_CSR: LSECSSON and LSECSSD are available in Cat.2 to Cat.6 only"

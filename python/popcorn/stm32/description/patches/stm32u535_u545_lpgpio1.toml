format = 1
source = "LPGPIO1_Py on AF11 of the pad, DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), which the CubeMX GPIO modes file of the STM32U535 and STM32U545 omits. PA1, PA3, PA6, PB0, PB1, PB3 and PB4 are bonded on every package of the two lines"

[match]
parts = ["STM32U5[34]5*"]
svd = ["STM32U535.svd", "STM32U545.svd"]

[alternates]
add = [
  { peripheral = "GPIOA", pin = 1, af = 11, signal = "lpgpio1_p0", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PA1" },
  { peripheral = "GPIOA", pin = 3, af = 11, signal = "lpgpio1_p1", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PA3" },
  { peripheral = "GPIOA", pin = 6, af = 11, signal = "lpgpio1_p2", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PA6" },
  { peripheral = "GPIOB", pin = 1, af = 11, signal = "lpgpio1_p3", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PB1" },
  { peripheral = "GPIOB", pin = 0, af = 11, signal = "lpgpio1_p9", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PB0" },
  { peripheral = "GPIOB", pin = 3, af = 11, signal = "lpgpio1_p11", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PB3" },
  { peripheral = "GPIOB", pin = 4, af = 11, signal = "lpgpio1_p12", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PB4" },
]

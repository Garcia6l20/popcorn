format = 1
source = "STM32L471 line content: no USB OTG and no LCD, DS10741 Rev 3 Table 2"

[match]
parts = ["STM32L471*"]

[peripherals]
drop = ["OTG_FS_GLOBAL", "OTG_FS_HOST", "OTG_FS_DEVICE", "OTG_FS_PWRCLK", "LCD"]
source = "DS10741 Rev 3, Table 2: STM32L471 has no USB OTG FS and no LCD. The CubeMX db lists neither and CMSIS stm32l471xx.h defines no OTG_FS_IRQn 67 and no LCD_IRQn 78. ST's STM32L471 SVD lists the four OTG blocks and the LCD with their IRQs"

[irqs]
drop = ["OTG_FS", "LCD"]

[[fields]]
instances = ["RCC"]
registers = ["AHB2RSTR"]
fields = ["OTGFSRST"]
drop = true
source = "RM0351 Rev 11, 6.4.11 RCC_AHB2RSTR: OTGFSRST is reserved for STM32L471 devices. The STM32L471 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["AHB2ENR"]
fields = ["OTGFSEN"]
drop = true
source = "RM0351 Rev 11, 6.4.17 RCC_AHB2ENR: OTGFSEN is reserved for STM32L471 devices. The STM32L471 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["AHB2SMENR"]
fields = ["OTGFSSMEN"]
drop = true
source = "RM0351 Rev 11, 6.4.23 RCC_AHB2SMENR: OTGFSSMEN is reserved for STM32L471 devices. The STM32L471 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1RSTR1"]
fields = ["LCDRST"]
drop = true
source = "RM0351 Rev 11, 6.4.13 RCC_APB1RSTR1: LCDRST is reserved for STM32L471/L4x5 devices. The STM32L471 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1ENR1"]
fields = ["LCDEN"]
drop = true
source = "RM0351 Rev 11, 6.4.19 RCC_APB1ENR1: LCDEN is reserved for STM32L471/L4x5 devices. The STM32L471 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1SMENR1"]
fields = ["LCDSMEN"]
drop = true
source = "RM0351 Rev 11, 6.4.25 RCC_APB1SMENR1: LCDSMEN is reserved for STM32L471/L4x5 devices. The STM32L471 SVD lists it"

format = 1
source = "LPGPIO1_Py on AF11 of the pad, DS13737 Rev 10 and DS13086 alternate function table, which the CubeMX GPIO modes file of the STM32U575 and STM32U585 omits. PB10 is bonded on every package but the 48-pin SMPS ones, the part names C..Q"

[match]
parts = ["STM32U5[78]5A*", "STM32U5[78]5C??x", "STM32U5[78]5O*", "STM32U5[78]5Q*", "STM32U5[78]5R*", "STM32U5[78]5V*", "STM32U5[78]5Z*"]

[alternates]
add = [
  { peripheral = "GPIOB", pin = 10, af = 11, signal = "lpgpio1_p4", source = "DS13737 Rev 10 and DS13086 alternate function table, AF11 of PB10" },
]

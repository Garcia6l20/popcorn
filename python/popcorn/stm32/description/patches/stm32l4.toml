source = "RM0351 Rev 11, 48.16.4 DBGMCU_APB1FZR1: bit 0 DBG_TIM2_STOP, bit 4 DBG_TIM6_STOP, bit 25 DBG_CAN1_STOP, bit 31 DBG_LPTIM1_STOP. The four SVDs spell them DBG_TIMER2_STOP, DBG_TIMER6_STOP, DBG_CAN_STOP and DBG_LPTIMER_STOP"


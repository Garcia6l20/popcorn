format = 1
source = "RM0038 Rev 18, 6.3.14 RCC_CSR: the reset flags are set by hardware and cleared by RMVF or a POR"

[match]
parts = ["STM32L1*"]
svd = ["STM32L1*.svd"]

[[fields]]
instances = ["RCC"]
registers = ["CSR"]
fields = ["LPWRRSTF", "WWDGRSTF", "IWDGRSTF", "SFTRSTF", "PORRSTF", "PINRSTF", "OBLRSTF"]
acc = "read_only"
source = "RM0038 Rev 18, 6.3.14 RCC_CSR: each reset flag is set by hardware and cleared by writing RMVF or by a POR. The register drawing marks them rw, a write of 0 is inferred to keep them"

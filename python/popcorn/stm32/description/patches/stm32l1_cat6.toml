format = 1
source = "RM0038 Rev 18 Cat.6 on DIE437, 384 KB flash in two banks: no FSMC and no SDIO, the second bank controlled by FLASH, DBGMCU_IDCODE, the FLASH version of Cat.4 and Cat.6, the factory information block and the CMSIS header suffix"

[match]
parts = ["STM32L1*"]
svd = ["STM32L1*.svd"]
dies = ["DIE437"]
flash_kib = [384]

[peripherals]
drop = ["FSMC", "SDIO"]
source = "RM0038 Rev 18, 3.1 and Table 51: the CubeMX parts of Cat.6 list no FSMC and no SDIO, the SVDs do"

[irqs]
drop = ["SDIO"]

[memory]
source = "RM0038 Rev 18, 3.2 Table 12 and 3.4: the flash interface programs and erases both banks, the family patch gives the first bank its controller and its erased value 0, the second bank takes the same. RM0038 Rev 18, 2.7 Table 7: the main flash boot aliases the flash at 0x0000 0000, so the second bank at 0x0804 0000 reads at 0x0004 0000. Table 7 lists the alias up to 0x0005 FFFF, the bank 2 alias up to 0x0006 FFFF is inferred, board check"
alias = [{ name = "BOOT_BANK2", start = 0x40000, region = "Flash_Bank2" }]
controller = { Flash_Bank2 = "FLASH" }
fill = { Flash_Bank2 = 0 }

[cmsis]
suffix = "xdx"
source = "stm32l151xdx.h, stm32l152xdx.h and stm32l162xdx.h are the CMSIS device headers of the Cat.6 devices"

[[resets]]
peripheral = "DBGMCU"
register = "IDCODE"
reset = 0x10000437
source = "RM0038 Rev 18, 30.6.1 MCU device ID code: DEV_ID[11:0] is 0x437 for Cat.6, REV_ID[15:0] 0x1000 is revision A of every category. One modelled revision"

[ip]
versions = { "FLASH" = "STM32L1_flash_cat46" }
source = "RM0038 Rev 18, Cat.6 flash interface. FLASH has no CubeMX version, the empty version is replaced"

[signature]
source = "RM0038 Rev 18, 31.1.1 and 31.2, Cat.3 to Cat.6: F_SIZE at 0x1FF800CC, U_ID(31:0) at 0x1FF800D0, U_ID(63:32) at 0x1FF800D4 and U_ID(95:64) at 0x1FF800E4. The ID words are fixed values: wafer coordinates 0x00320014, wafer 1, lot POPCORN in ASCII. RM0038 has no package register. The option bytes at offset 0 hold the virgin values of RM0038 3.9.8 and 3.9.9, OBR 0x00F800AA and WRPRx 0, with their complements per Table 18: RDP 0xAA, USER 0xF8, WRPx 0, the upper bytes of the RDP and USER words 0xFF, inferred, board check. Factory calibration words, 12-bit ADC codes at VDDA = VREF+ = 3.0 V, the datasheet typical values as V / 3.0 V x 4095, rounded, DS10002 Table 60: VREFINT_CAL at 0x1FF800F8 = 1671 from VREFINT 1.224 V, TS_CAL1 at 0x1FF800FA = 680 at 30 C from V30 = V110 - 80 x Avg_Slope = 626.8 mV - 80 x 1.61 mV/C = 498.0 mV, derived from two typicals, inferred, TS_CAL2 at 0x1FF800FE = 856 at 110 C from V110 626.8 mV. The ADC model converts its temperature sensor to TS_CAL1 and VREFINT to VREFINT_CAL, so the LL macros give 30 C and 3000 mV. The L100 datasheets DS9496 and DS10193 give VREFINT_CAL and no TS_CAL: the L100 parts share the die and keep the words, inferred, board check"
region = "OPTION_FACTORY"
uid = 0xD0
flash_size = 0xCC
uid_words = [0x0032_0014, 0x4F52_4E01, 0x504F_5043]
uid_offsets = [0, 4, 0x14]
content = [
  { offset = 0x00, data = [0xAA, 0x00, 0x55, 0xFF, 0xF8, 0x00, 0x07, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF] },
  { offset = 0xF8, data = [0x87, 0x06, 0xA8, 0x02] },
  { offset = 0xFE, data = [0x58, 0x03] },
]

[[fields]]
instances = ["RCC"]
registers = ["AHBRSTR"]
fields = ["FSMCRST"]
drop = true
source = "RM0038 Rev 18, 6.3.5 RCC_AHBRSTR: FSMC and SDIO bits are available in Cat.4 only"

[[fields]]
instances = ["RCC"]
registers = ["AHBENR"]
fields = ["FSMCEN"]
drop = true
source = "RM0038 Rev 18, 6.3.8 RCC_AHBENR: FSMC and SDIO bits are available in Cat.4 only"

[[fields]]
instances = ["RCC"]
registers = ["AHBLPENR"]
fields = ["FSMCLPEN"]
drop = true
source = "RM0038 Rev 18, 6.3.11 RCC_AHBLPENR: FSMC and SDIO bits are available in Cat.4 only"

[[fields]]
instances = ["RCC"]
registers = ["APB2RSTR"]
fields = ["SDIORST"]
drop = true
source = "RM0038 Rev 18, 6.3.6 RCC_APB2RSTR: FSMC and SDIO bits are available in Cat.4 only"

[[fields]]
instances = ["RCC"]
registers = ["APB2ENR"]
fields = ["SDIOEN"]
drop = true
source = "RM0038 Rev 18, 6.3.9 RCC_APB2ENR: FSMC and SDIO bits are available in Cat.4 only"

[[fields]]
instances = ["RCC"]
registers = ["APB2LPENR"]
fields = ["SDIOLPEN"]
drop = true
source = "RM0038 Rev 18, 6.3.12 RCC_APB2LPENR: FSMC and SDIO bits are available in Cat.4 only"

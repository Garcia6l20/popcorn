format = 1
source = "PWR_SCCR reset of the STM32H562, STM32H563 and STM32H573 packages that use the LDO regulator, the RefNames without the Q suffix. RM0481 Rev 5, 10.11.11: reset 0x0000 0X00 on STM32H562/563/573, hardware sets LDOEN (bit 8) when the package uses the LDO and SMPSEN (bit 9) when it uses the SMPS, the two bits exclusive. The SVDs give 0"

[match]
parts = ["STM32H562???x", "STM32H563???x", "STM32H573???x"]

[[resets]]
peripheral = "PWR"
register = "PWR_SCCR"
reset = 0x100
source = "RM0481 Rev 5, 10.11.11 PWR supply configuration control register (PWR_SCCR): LDOEN is set by hardware when the package uses the LDO regulator. The SVDs give 0"

format = 1
source = "LPGPIO1_Py on AF11 of the pad, DS13737 Rev 10 and DS13086 alternate function table, which the CubeMX GPIO modes file of the STM32U575 and STM32U585 omits. PD13, PE0 and PE2 are bonded on the UFBGA169, UFBGA132, LQFP100 and LQFP144 packages only"

[match]
parts = ["STM32U5[78]5A*", "STM32U5[78]5Q*", "STM32U5[78]5V*", "STM32U5[78]5Z*"]

[alternates]
add = [
  { peripheral = "GPIOD", pin = 13, af = 11, signal = "lpgpio1_p6", source = "DS13737 Rev 10 and DS13086 alternate function table, AF11 of PD13" },
  { peripheral = "GPIOE", pin = 0, af = 11, signal = "lpgpio1_p13", source = "DS13737 Rev 10 and DS13086 alternate function table, AF11 of PE0" },
  { peripheral = "GPIOE", pin = 2, af = 11, signal = "lpgpio1_p14", source = "DS13737 Rev 10 and DS13086 alternate function table, AF11 of PE2" },
]

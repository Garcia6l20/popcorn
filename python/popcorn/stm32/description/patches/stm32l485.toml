format = 1
source = "STM32L485 line content: the STM32L486 register set without LCD. No STM32L485 SVD or datasheet exists. CubeMX STM32L485J(C-E)Yx and CMSIS stm32l485xx.h give the content"

[match]
parts = ["STM32L485*"]

[svd]
name = "STM32L486"

[peripherals]
drop = ["LCD"]
source = "CMSIS cmsis-device-l4 v1.7.5 stm32l485xx.h defines no LCD and no LCD_IRQn 78, the CubeMX db lists no LCD instance for STM32L485J(C-E)Yx. Every other block equals stm32l486xx.h. The STM32L486 SVD lists the LCD with its IRQ"

[irqs]
drop = ["LCD"]

[[fields]]
instances = ["RCC"]
registers = ["APB1RSTR1"]
fields = ["LCDRST"]
drop = true
source = "RM0351 Rev 11, 6.4.13 RCC_APB1RSTR1: LCDRST is reserved for STM32L471/L4x5 devices. The STM32L486 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1ENR1"]
fields = ["LCDEN"]
drop = true
source = "RM0351 Rev 11, 6.4.19 RCC_APB1ENR1: LCDEN is reserved for STM32L471/L4x5 devices. The STM32L486 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1SMENR1"]
fields = ["LCDSMEN"]
drop = true
source = "RM0351 Rev 11, 6.4.25 RCC_APB1SMENR1: LCDSMEN is reserved for STM32L471/L4x5 devices. The STM32L486 SVD lists it"

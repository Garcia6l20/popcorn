format = 1
source = "RM0351 Rev 11, 47 USB on-the-go full-speed against ST's STM32L475, L476 and L486 SVDs: one OTG_FS block with the RM0351 47.15 register content on the lines that carry the OTG, STM32L475, L476, L485 and L486. STM32L471 has no OTG. The rules name the SVD register names, most with an FS_ prefix the builder strips after the patches"

[match]
parts = ["STM32L475*", "STM32L476*", "STM32L485*", "STM32L486*"]

[peripherals]
renames = { OTG_FS_GLOBAL = "OTG_FS" }
source = "RM0351 Rev 11, 2.2.2 Table 1 and 47.15.57 Table 333: one OTG_FS peripheral at 0x5000 0000. The SVDs name its global register block OTG_FS_GLOBAL"

[[peripheral_merges]]
into = "OTG_FS"
peripherals = ["OTG_FS_HOST", "OTG_FS_DEVICE", "OTG_FS_PWRCLK"]
size = 0x20000
source = "RM0351 Rev 11, 47.15.57 Table 333: one OTG_FS register map from 0x000, the host registers from 0x400, the device registers from 0x800, OTG_PCGCCTL at 0xE00, and 47.14.1 Table 329: the data FIFO push and pop windows at 0x1000 * (n + 1). 2.2.2 Table 1 gives OTG_FS 0x5000 0000 to 0x5003 FFFF. The SVDs split it into OTG_FS_GLOBAL, OTG_FS_HOST, OTG_FS_DEVICE and OTG_FS_PWRCLK of 0x400 bytes each. The 0x20000 direct FIFO access window is left out"

[ip]
renames = { USB_OTG_FS = ["OTG_FS"] }
source = "The CubeMX db names the instance USB_OTG_FS, the SVDs give no OTG_FS block, RM0351 Rev 11 2.2.2 Table 1 names it OTG_FS"

[[register_drops]]
peripheral = "OTG_FS"
names = ["FS_GNPTXFSIZ_Host"]
source = "RM0351 Rev 11, 47.15.13 OTG_HNPTXFSIZ/OTG_DIEPTXF0 at 0x028: one register, NPTXFD[15:0] and NPTXFSA[15:0] in host mode, the same bits TX0FD and TX0FSA in device mode, Table 326 note 1. The SVDs give the two views as two registers, the host view an alternate of the device view. The device view stays, named and spelled as the host view below"

[[register_renames]]
peripherals = ["OTG_FS"]
renames = { FS_GRXSTSR_Device = "GRXSTSR_DEVICE", FS_GRXSTSR_Host = "GRXSTSR_HOST", FS_GNPTXFSIZ_Device = "HNPTXFSIZ", FS_GNPTXSTS = "HNPTXSTS" }
source = "RM0351 Rev 11, 47.15.8 and 47.15.9 OTG_GRXSTSR in device and host mode, 47.15.13 OTG_HNPTXFSIZ, 47.15.14 OTG_HNPTXSTS. The SVDs spell them GRXSTSR_Device, GRXSTSR_Host, GNPTXFSIZ_Device and GNPTXSTS. The device and host views of GRXSTSR take the suffixes of the U5 OTG_FS description, the one register at 0x028 its host-mode name HNPTXFSIZ"

[[registers]]
peripheral = "OTG_FS"
name = "GSNPSID"
offset = 0x40
width = 32
reset = 0x4F54310A
acc = "read_only"
fields = []
source = "CMSIS cmsis-device-l4 v1.7.5 stm32l476xx.h USB_OTG_GlobalTypeDef places GSNPSID at 0x040, HAL stm32l4xx-hal-driver v1.13.6 stm32l4xx_ll_usb.h:292-293 defines USB_OTG_CORE_ID_300A and USB_OTG_CORE_ID_310A. TinyUSB src/portable/synopsys/dwc2/dwc2_info.py row ST L476 FS reads 0x4F54310A, inferred, TinyUSB register dump of an L476. RM0351 Rev 11 47.15 documents no register at 0x040 and the SVDs omit it. Drivers read GSNPSID to pick the core revision, TinyUSB's dwc2 refuses a core whose ID is not 0x4F54xxxx"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG1"
offset = 0x44
width = 32
reset = 0x00000000
acc = "read_only"
fields = []
source = "Inferred, TinyUSB register dump of an L476: TinyUSB src/portable/synopsys/dwc2/dwc2_info.py row ST L476 FS: GHWCFG1 0, no endpoint direction configuration. CMSIS cmsis-device-l4 v1.7.5 stm32l476xx.h USB_OTG_GlobalTypeDef places GHWCFG1 to GHWCFG3 at 0x044 to 0x04C. RM0351 Rev 11 47.15 documents no register there"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG2"
offset = 0x48
width = 32
reset = 0x229ED520
acc = "read_only"
fields = []
source = "Inferred, TinyUSB register dump of an L476: TinyUSB src/portable/synopsys/dwc2/dwc2_info.py row ST L476 FS. Decoded with the dwc2_ghwcfg2_t layout: op_mode 0, arch 0 (slave), single_point 1, hs_phy_type 0, fs_phy_type 1 (dedicated), num_dev_ep 5 (six endpoints with EP0), num_host_ch 11 (twelve channels), enable_dynamic_fifo 1, as RM0351 Rev 11 47.3 Table 322 gives 6 endpoints and 12 channels for STM32L47x/L48x. CMSIS stm32l476xx.h places GHWCFG2 at 0x048"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG3"
offset = 0x4C
width = 32
reset = 0x0200D1E8
acc = "read_only"
fields = []
source = "Inferred, TinyUSB register dump of an L476: TinyUSB src/portable/synopsys/dwc2/dwc2_info.py row ST L476 FS. CMSIS cmsis-device-l4 v1.7.5 stm32l476xx.h places GHWCFG3 at 0x04C"

[[registers]]
peripheral = "OTG_FS"
name = "GHWCFG4"
offset = 0x50
width = 32
reset = 0x17F08030
acc = "read_only"
fields = []
source = "Inferred, TinyUSB register dump of an L476: TinyUSB src/portable/synopsys/dwc2/dwc2_info.py row ST L476 FS. CMSIS cmsis-device-l4 v1.7.5 stm32l476xx.h USB_OTG_GlobalTypeDef leaves 0x050 reserved, TinyUSB dwc2_type.h places ghwcfg4 there"

[[registers]]
peripheral = "OTG_FS"
name = "GDFIFOCFG"
offset = 0x5C
width = 32
reset = 0x00000000
acc = "read_write"
fields = []
source = "TinyUSB dfifo_device_init in dcd_dwc2.c writes GDFIFOCFG on every bus reset. CMSIS cmsis-device-l4 v1.7.5 stm32l476xx.h USB_OTG_GlobalTypeDef places GDFIFOCFG at 0x05C, RM0351 Rev 11 47.15 documents no register there and the SVDs omit it. Plain storage with reset 0, inferred, TinyUSB register dump of an L476"

[[registers]]
peripheral = "OTG_FS"
name = "DFIFO0"
offset = 0x1000
width = 32
reset = 0x00000000
acc = "read_write"
fields = []
source = "RM0351 Rev 11, 47.14.1 Table 329: the data FIFO push and pop windows at 0x1000 * (n + 1) from the OTG_FS base, one 4 KB window per endpoint or channel. DFIFO0 to DFIFO5 describe word 0 of the windows of endpoints and channels 0 to 5, which is what TinyUSB (dwc2->fifo[ep][0]) and the HAL USBx_DFIFO(i) access. A firmware addressing another word of the window is not served"


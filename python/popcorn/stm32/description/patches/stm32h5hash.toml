format = 1
source = "RM0481 Rev 5 HASH on the STM32H52x to H57x: digest registers HASH_HR16 to HASH_HR41 and 6-bit NBWE and NBWP, where the SVDs stop at HASH_HR15 with 5 bits. The STM32H503 is documented by RM0492 and keeps its SVD HASH"

[match]
parts = ["STM32H52*", "STM32H53*", "STM32H54*", "STM32H55*", "STM32H56*", "STM32H57*"]
svd = ["STM32H5*.svd"]

[[fields]]
instances = ["HASH"]
registers = ["HASH_SR"]
fields = ["NBWE", "NBWP"]
width = 6
source = "RM0481 Rev 5, 40.6.6 HASH status register (HASH_SR): NBWE[5:0] in bits 21:16 and NBWP[5:0] in bits 14:9. ST's STM32H573 SVD gives 5 bits each, and SHA3-224 needs NBWE 37"

[[registers]]
peripheral = "HASH"
name = "HASH_HR16"
offset = 0x350
width = 32
reset = 0
acc = "read_only"
fields = [{ name = "Hx", lsb = 0, width = 32 }]
source = "RM0481 Rev 5, 40.6.4 HASH digest registers: HASH_HRx at 0x310 + 0x4 * x, x = 5 to 41, SHAKE128 returns HR0 to HR41. ST's STM32H573 SVD stops at HASH_HR15"

[[registers]]
peripheral = "HASH"
name = "HASH_HR17"
offset = 0x354
width = 32
reset = 0
acc = "read_only"

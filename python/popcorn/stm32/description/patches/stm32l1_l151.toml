format = 1
source = "RM0038 Rev 18, 1.4: the LCD controller is on the STM32L152 and STM32L162 only, the L151 SVD lists it and CubeMX gives it to no L151 part"

[match]
parts = ["STM32L151*"]
svd = ["STM32L151.svd"]

[peripherals]
drop = ["LCD"]
source = "RM0038 Rev 18, 1.4: LCD on the STM32L152xx and STM32L162xx only"

[irqs]
drop = ["LCD"]

[[fields]]
instances = ["RCC"]
registers = ["APB1RSTR"]
fields = ["LCDRST"]
drop = true
source = "RM0038 Rev 18, 6.3.7 RCC_APB1RSTR: the LCD bits are dropped with LCD"

[[fields]]
instances = ["RCC"]
registers = ["APB1ENR"]
fields = ["LCDEN"]
drop = true
source = "RM0038 Rev 18, 6.3.10 RCC_APB1ENR: the LCD bits are dropped with LCD"

[[fields]]
instances = ["RCC"]
registers = ["APB1LPENR"]
fields = ["LCDLPEN"]
drop = true
source = "RM0038 Rev 18, 6.3.13 RCC_APB1LPENR: the LCD bits are dropped with LCD"

[[fields]]
instances = ["GPIOI"]
registers = ["GPIOI_MODER"]
fields = ["MODE12", "MODE13", "MODE14", "MODE15"]
drop = true
source = "Silicon read-back on two STM32H573 parts over SWD, 2026-10-27: GPIOI_MODER at 0x42022000 takes 0xFFFFFFFF and returns 0x00FFFFFF, so port I has pins 0 to 11. RM0481 Rev 5 13.4.1 and 13.4.13 give the port I MODER reset 0x00FFFFFF and SECCFGR reset 0x00000FFF, the same 12 pins. The other per-pin registers follow from the pin count, and the H562 and H563, one die with the H573, are taken to have the same count"


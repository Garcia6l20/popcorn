[[resets]]
peripheral = "FLASH"
register = "FLASH_OPTSR_CUR"
reset = 0x2D30EDF8
source = "Silicon read-back on two STM32H573 parts in delivery state, option bytes never changed: FLASH_OPTSR_CUR 0x2D30EDF8. RM0481 Rev 5, 7.11.19 FLASH_OPTSR_CUR gives reset value 0xXXXX XXXX, the register is loaded from the option bytes, and Table 55 (7.4.3) with 7.4.4 gives the delivery value: BOOT_UBE 0xB4, IWDG_STDBY and IWDG_STOP 1, PRODUCT_STATE 0xED, NRST_STOP, NRST_STDBY, IWDG_SW and WWDG_SW 1, BORH_EN 0, BOR_LEV 0, SWAP_BANK 0. The Table 55 row prints 29 bit digits for 28 field bits and the read-back shows the extra digit as bit 5 set to 1. The STM32H562 and STM32H563 are taken equal, with the same RM0481 Table 55 row. ST STM32H573 SVD gives 0"

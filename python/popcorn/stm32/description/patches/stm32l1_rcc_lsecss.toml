format = 1
source = "RM0038 Rev 18, 6.3.4 and 6.3.14: the CSS on LSE bits of RCC_CIR and RCC_CSR on Cat.2 to Cat.6. The STM32L152 SVD has them, the STM32L100, STM32L151 and STM32L162 SVDs lack them"

[match]
parts = ["STM32L1*"]
svd = ["STM32L100.svd", "STM32L151.svd", "STM32L162.svd"]
dies = ["DIE429", "DIE427", "DIE436", "DIE437"]

[[fields]]
instances = ["RCC"]
registers = ["CIR"]
add = { name = "LSECSSIE", lsb = 14, width = 1, acc = "read_write", reset = 0 }
source = "RM0038 Rev 18, 6.3.4 RCC_CIR: LSECSSIE in bit 14, Cat.2 to Cat.6"

[[fields]]
instances = ["RCC"]
registers = ["CIR"]
add = { name = "LSECSSC", lsb = 22, width = 1, acc = "write_only", reset = 0 }
source = "RM0038 Rev 18, 6.3.4 RCC_CIR: LSECSSC in bit 22, Cat.2 to Cat.6"

[[fields]]
instances = ["RCC"]
registers = ["CSR"]
add = { name = "LSECSSON", lsb = 11, width = 1, acc = "read_write", reset = 0 }
source = "RM0038 Rev 18, 6.3.14 RCC_CSR: LSECSSON in bit 11, Cat.2 to Cat.6"

[[fields]]
instances = ["RCC"]
registers = ["CSR"]
add = { name = "LSECSSD", lsb = 12, width = 1, acc = "read_only", reset = 0 }
source = "RM0038 Rev 18, 6.3.14 RCC_CSR: LSECSSD in bit 12, set by hardware on an LSE failure, Cat.2 to Cat.6"

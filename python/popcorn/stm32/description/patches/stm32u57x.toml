format = 1
source = "Port I of the STM32U575 and STM32U585 has 8 pins and no GPIOx_AFRH pins, RM0456 Rev 7 13.4.1, 13.4.13. The STM32U59x, 5Ax, 5Fx and 5Gx have 16"

[match]
parts = ["STM32U575*", "STM32U585*"]

[[fields]]
instances = ["GPIOI"]
registers = ["GPIO_MODER"]
fields = ["MODE8", "MODE9", "MODE10", "MODE11", "MODE12", "MODE13", "MODE14", "MODE15"]
drop = true
source = "Silicon read-back on a NUCLEO-U575ZI-Q (STM32U575, DEV_ID 0x482 rev W) over SWD, 2026-10-27, GPIOI clock on: GPIOI_MODER 0xFFFFFFFF reads back 0x0000FFFF, GPIOI_OSPEEDR 0xFFFFFFFF reads back 0x0000FFFF, GPIOI_AFRH 0xFFFFFFFF and 0x0000D5A1 read back 0 and the GPIOH_AFRH control reads 0xFFFFFFFF, so port I has pins 0 to 7 and no alternate function high register. RM0456 Rev 7 13.4.1 gives the port I MODER reset 0x0000FFFF and 13.4.13 the SECCFGR reset 0x000000FF on STM32U575/585, 0xFFFFFFFF and 0x0000FFFF on STM32U59x/5Ax/5Fx/5Gx. The other per-pin registers follow from the pin count"


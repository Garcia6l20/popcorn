format = 1
source = "RM0038 Rev 18 Cat.3 on DIE436, 256 KB flash, the RPN ends in A: FSMC, SDIO, UART4 and UART5 absent, DBGMCU_IDCODE, the FLASH version of Cat.3, F_SIZE codes, the factory information block and the CMSIS header suffix"

[match]
parts = ["STM32L1*"]
svd = ["STM32L1*.svd"]
dies = ["DIE436"]
flash_kib = [256]

[peripherals]
drop = ["FSMC", "SDIO", "UART4", "UART5"]
source = "RM0038 Rev 18, 3.1 and Table 50 (Cat.3 vector table): Cat.3 has no FSMC, SDIO, UART4 and UART5. The CubeMX parts of this die list none of them, the SVDs do"

[irqs]
drop = ["SDIO", "UART4", "UART5"]

[cmsis]
suffix = "xca"
source = "stm32l151xca.h, stm32l152xca.h and stm32l162xca.h are the CMSIS device headers of the Cat.3 devices on DIE436"

[[resets]]
peripheral = "DBGMCU"
register = "IDCODE"
reset = 0x10000436
source = "RM0038 Rev 18, 30.6.1 MCU device ID code: DEV_ID[11:0] is 0x436 for Cat.3 on DIE436, REV_ID[15:0] 0x1000 is revision A of every category. One modelled revision"

[ip]
versions = { "FLASH" = "STM32L1_flash_cat3" }
source = "RM0038 Rev 18, Cat.3 flash interface. FLASH has no CubeMX version, the empty version is replaced"

[signature]
source = "RM0038 Rev 18, 31.1.1 and 31.2, Cat.3 to Cat.6: F_SIZE at 0x1FF800CC, U_ID(31:0) at 0x1FF800D0, U_ID(63:32) at 0x1FF800D4 and U_ID(95:64) at 0x1FF800E4. The ID words are fixed values: wafer coordinates 0x00320014, wafer 1, lot POPCORN in ASCII. RM0038 has no package register. F_SIZE of DEV_ID 0x436 is 0 for 384 KB and 1 for 256 KB. The option bytes at offset 0 hold the virgin values of RM0038 3.9.8 and 3.9.9, OBR 0x00F800AA and WRPRx 0, with their complements per Table 18: RDP 0xAA, USER 0xF8, WRPx 0, the upper bytes of the RDP and USER words 0xFF, inferred, board check"
region = "OPTION_FACTORY"
uid = 0xD0
flash_size = 0xCC
uid_words = [0x0032_0014, 0x4F52_4E01, 0x504F_5043]
uid_offsets = [0, 4, 0x14]
flash_size_codes = { 384 = 0, 256 = 1 }
content = [
  { offset = 0x00, data = [0xAA, 0x00, 0x55, 0xFF, 0xF8, 0x00, 0x07, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF] },
]

[[fields]]
instances = ["RCC"]
registers = ["AHBRSTR"]
fields = ["FSMCRST"]
drop = true
source = "RM0038 Rev 18, 6.3.5 RCC_AHBRSTR: FSMC and SDIO bits are available in Cat.4 only, the UART4 and UART5 bits are dropped with the instances"

[[fields]]
instances = ["RCC"]
registers = ["AHBENR"]
fields = ["FSMCEN"]
drop = true
source = "RM0038 Rev 18, 6.3.8 RCC_AHBENR: FSMC and SDIO bits are available in Cat.4 only, the UART4 and UART5 bits are dropped with the instances"

[[fields]]
instances = ["RCC"]
registers = ["AHBLPENR"]
fields = ["FSMCLPEN"]
drop = true
source = "RM0038 Rev 18, 6.3.11 RCC_AHBLPENR: FSMC and SDIO bits are available in Cat.4 only, the UART4 and UART5 bits are dropped with the instances"

[[fields]]
instances = ["RCC"]
registers = ["APB2RSTR"]
fields = ["SDIORST"]
drop = true
source = "RM0038 Rev 18, 6.3.6 RCC_APB2RSTR: FSMC and SDIO bits are available in Cat.4 only, the UART4 and UART5 bits are dropped with the instances"

[[fields]]
instances = ["RCC"]
registers = ["APB2ENR"]
fields = ["SDIOEN"]
drop = true
source = "RM0038 Rev 18, 6.3.9 RCC_APB2ENR: FSMC and SDIO bits are available in Cat.4 only, the UART4 and UART5 bits are dropped with the instances"

[[fields]]
instances = ["RCC"]
registers = ["APB2LPENR"]
fields = ["SDIOLPEN"]
drop = true
source = "RM0038 Rev 18, 6.3.12 RCC_APB2LPENR: FSMC and SDIO bits are available in Cat.4 only, the UART4 and UART5 bits are dropped with the instances"

[[fields]]

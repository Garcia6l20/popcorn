format = 1
source = "RM0038 Rev 18, 6.3.4 RCC_CIR: the LSE CSS flag clear bit on Cat.2 to Cat.6"

[match]
parts = ["STM32L1*"]
svd = ["STM32L1*.svd"]
dies = ["DIE429", "DIE427", "DIE436", "DIE437"]

[[cross]]
instances = ["RCC"]
reg = "CIR"
target_reg = "CIR"
effect = "clear"
pairs = { LSECSSC = "LSECSSF" }
source = "RM0038 Rev 18, 6.3.4 RCC_CIR: a write of 1 to LSECSSC clears LSECSSF, Cat.2 to Cat.6"

format = 1
source = "LPGPIO1_Py on AF11 of the pad, DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), which the CubeMX GPIO modes file of the STM32U535 and STM32U545 omits. PD13, PE0 and PE2 are bonded on the 100-pin packages"

[match]
parts = ["STM32U5[34]5V*"]
svd = ["STM32U535.svd", "STM32U545.svd"]

[alternates]
add = [
  { peripheral = "GPIOD", pin = 13, af = 11, signal = "lpgpio1_p6", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PD13" },
  { peripheral = "GPIOE", pin = 0, af = 11, signal = "lpgpio1_p13", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PE0" },
  { peripheral = "GPIOE", pin = 2, af = 11, signal = "lpgpio1_p14", source = "DS14217 Rev 5 and DS14216 Rev 5 alternate function table AF8 to AF15 (Table 28 and Table 29), AF11 of PE2" },
]

format = 1
source = "STM32L475 line content: no LCD, DS10969 Rev 5 Table 2"

[match]
parts = ["STM32L475*"]

[peripherals]
drop = ["LCD"]
source = "DS10969 Rev 5, Table 2: STM32L475 has no LCD. The CubeMX db lists none and CMSIS stm32l475xx.h defines no LCD_IRQn 78. ST's STM32L475 SVD lists the LCD with its IRQ"

[irqs]
drop = ["LCD"]

[[fields]]
instances = ["RCC"]
registers = ["APB1RSTR1"]
fields = ["LCDRST"]
drop = true
source = "RM0351 Rev 11, 6.4.13 RCC_APB1RSTR1: LCDRST is reserved for STM32L471/L4x5 devices. The STM32L475 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1ENR1"]
fields = ["LCDEN"]
drop = true
source = "RM0351 Rev 11, 6.4.19 RCC_APB1ENR1: LCDEN is reserved for STM32L471/L4x5 devices. The STM32L475 SVD lists it"

[[fields]]
instances = ["RCC"]
registers = ["APB1SMENR1"]
fields = ["LCDSMEN"]
drop = true
source = "RM0351 Rev 11, 6.4.25 RCC_APB1SMENR1: LCDSMEN is reserved for STM32L471/L4x5 devices. The STM32L475 SVD lists it"

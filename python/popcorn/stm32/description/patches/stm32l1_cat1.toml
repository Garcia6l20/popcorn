format = 1
source = "RM0038 Rev 18 Cat.1 on DIE416: DBGMCU_IDCODE, the FLASH and RTC versions of Cat.1, the factory information block and the CMSIS header suffix"

[match]
parts = ["STM32L1*"]
svd = ["STM32L1*.svd"]
dies = ["DIE416"]

[cmsis]
suffix = "xb"
source = "stm32l100xb.h, stm32l151xb.h and stm32l152xb.h are the CMSIS device headers of the Cat.1 devices"

[[resets]]
peripheral = "DBGMCU"
register = "IDCODE"
reset = 0x10000416
source = "RM0038 Rev 18, 30.6.1 MCU device ID code: DEV_ID[11:0] is 0x416 for Cat.1, REV_ID[15:0] 0x1000 is revision A of every category. One modelled revision"

[ip]
versions = { "FLASH" = "STM32L1_flash_cat1", "RTC" = "STM32L1_rtc_cat1" }
source = "RM0038 Rev 18, Cat.1 flash interface and RTC with one tamper input. FLASH has no CubeMX version, the empty version is replaced. RTC replaces rtc2_v2_5_Cube, the version of every category"

[signature]
source = "RM0038 Rev 18, 31.1.1 and 31.2, Cat.1 and Cat.2: F_SIZE at 0x1FF8004C, U_ID(31:0) at 0x1FF80050, U_ID(63:32) at 0x1FF80054 and U_ID(95:64) at 0x1FF80064. The ID words are fixed values: wafer coordinates 0x00320014, wafer 1, lot POPCORN in ASCII. RM0038 has no package register. The option bytes at offset 0 hold the virgin values of RM0038 3.9.8 and 3.9.9, OBR 0x00F800AA and WRPRx 0, with their complements per Table 18: RDP 0xAA, USER 0xF8, WRPx 0, the upper bytes of the RDP and USER words 0xFF, inferred, board check. Factory calibration words, 12-bit ADC codes at VDDA = VREF+ = 3.0 V, the datasheet typical values as V / 3.0 V x 4095, rounded, DS6876 Table 58: VREFINT_CAL at 0x1FF80078 = 1671 from VREFINT 1.224 V, TS_CAL1 at 0x1FF8007A = 680 at 30 C from V30 = V110 - 80 x Avg_Slope = 626.8 mV - 80 x 1.61 mV/C = 498.0 mV, derived from two typicals, inferred, TS_CAL2 at 0x1FF8007E = 856 at 110 C from V110 626.8 mV. The ADC model converts its temperature sensor to TS_CAL1 and VREFINT to VREFINT_CAL, so the LL macros give 30 C and 3000 mV. The L100 datasheets DS9496 and DS10193 give VREFINT_CAL and no TS_CAL: the L100 parts share the die and keep the words, inferred, board check"
region = "OPTION_FACTORY"
uid = 0x50
flash_size = 0x4C
uid_words = [0x0032_0014, 0x4F52_4E01, 0x504F_5043]
uid_offsets = [0, 4, 0x14]
content = [
  { offset = 0x00, data = [0xAA, 0x00, 0x55, 0xFF, 0xF8, 0x00, 0x07, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0xFF, 0xFF] },
  { offset = 0x78, data = [0x87, 0x06, 0xA8, 0x02] },
  { offset = 0x7E, data = [0x58, 0x03] },
]

[[fields]]
instances = ["DBGMCU"]
registers = ["APB1_FZ"]
fields = ["DBG_RTC_STOP"]
drop = true
source = "RM0038 Rev 18, 30.16.4 DBGMCU_APB1_FZ: DBG_RTC_STOP is available in Cat.2 to Cat.6 only"

[[fields]]
instances = ["RCC"]
registers = ["CIR"]
fields = ["LSECSSF"]
drop = true
source = "RM0038 Rev 18, 6.3.4 RCC_CIR: LSECSSF is available in Cat.2 to Cat.6 only"

[[register_drops]]
peripheral = "RTC"
names = ["SSR", "SHIFTR", "TSSSR", "CALR", "ALRMASSR", "ALRMBSSR"]
source = "RM0038 Rev 18, 20.6.11, 20.6.12, 20.6.15, 20.6.16, 20.6.18 and 20.6.19: RTC_SSR, RTC_SHIFTR, RTC_TSSSR, RTC_CALR, RTC_ALRMASSR and RTC_ALRMBSSR are available on Cat.2 to Cat.6 only. The SVDs list them on every category"

[[fields]]
instances = ["RTC"]
registers = ["CR"]
fields = ["BYPSHAD", "COSEL"]
drop = true
source = "RM0038 Rev 18, 20.6.3 RTC_CR: BYPSHAD and COSEL are available on Cat.2 to Cat.6 only"

[[fields]]
instances = ["RTC"]
registers = ["ISR"]
fields = ["RECALPF", "TAMP3F", "TAMP2F", "SHPF"]
drop = true
source = "RM0038 Rev 18, 20.2 and 20.6.4 RTC_ISR: Cat.1 has one tamper input, no RTC_CALR and no RTC_SHIFTR, so TAMP2F, TAMP3F, RECALPF and SHPF are dropped with them. 20.6.4 gives bit 3 as SHPF and as reserved, the Cat.1 reading inferred"

[[fields]]
instances = ["RTC"]
registers = ["TAFCR"]
fields = ["TAMPPUDIS", "TAMPPRCH", "TAMPFLT", "TAMPFREQ", "TAMPTS", "TAMP3TRG", "TAMP3E", "TAMP2TRG", "TAMP2E"]
drop = true
source = "RM0038 Rev 18, 20.2 and 20.6.17 RTC_TAFCR: TAMPPUDIS, TAMPPRCH, TAMPFLT, TAMPFREQ, TAMPTS, TAMP2TRG and TAMP2E are available on Cat.2 to Cat.6 only. Cat.1 has one tamper input, so TAMP3TRG and TAMP3E are dropped too, inferred"

[[fields]]
instances = ["RTC"]
registers = ["PRER"]
fields = ["PREDIV_S"]
width = 13
source = "RM0038 Rev 18, 20.3.1 and 20.6.5 RTC_PRER: the synchronous prescaler has 13 bits on Cat.1, PREDIV_S[14:13] are reserved. The SVDs give 15 bits"

source = "RM0481 Rev 5, 51.6.20/51.6.23 RTC status register (RTC_SR) / RTC status clear register (RTC_SCR)"

[[cross]]
ip = "SAI"
reg = "SAI_ACLRFR"
target_reg = "SAI_ASR"
effect = "clear"
pairs = { CLFSDET = "LFSDET", CAFSDET = "AFSDET", CCNRDY = "CNRDY", CWCKCFG = "WCKCFG", CMUTEDET = "MUTEDET", COVRUDR = "OVRUDR" }
source = "RM0481 Rev 5, 59.6.7/59.6.8 SAI status register (SAI_ASR) / SAI clear flag register (SAI_ACLRFR), sub-block A"

[[cross]]
ip = "SAI"
reg = "SAI_BCLRFR"
target_reg = "SAI_BSR"
effect = "clear"
pairs = { CLFSDET = "LFSDET", CAFSDET = "AFSDET", CCNRDY = "CNRDY", CWCKCFG = "WCKCFG", CMUTEDET = "MUTEDET", COVRUDR = "OVRUDR" }
source = "RM0481 Rev 5, 59.6.15/59.6.16 SAI status register (SAI_BSR) / SAI clear flag register (SAI_BCLRFR), sub-block B"

[[cross]]
ip = "SPI"
reg = "SPI_IFCR"
target_reg = "SPI_SR"
effect = "clear"
pairs = { SUSPC = "SUSP", MODFC = "MODF", TIFREC = "TIFRE", CRCEC = "CRCE", OVRC = "OVR", UDRC = "UDR", TXTFC = "TXTF", EOTC = "EOT" }
source = "RM0481 Rev 5, 58.11.6/58.11.7 SPI/I2S status register (SPI_SR) / SPI/I2S interrupt/status flags clear register (SPI_IFCR)"

[[cross]]
ip = "USART"
reg = "USART_ICR"
target_reg = "USART_ISR_enabled"
effect = "clear"
pairs = { CMCF = "CMF", EOBCF = "EOBF", RTOCF = "RTOF", CTSCF = "CTSIF", LBDCF = "LBDF", TCBGTCF = "TCBGT", TCCF = "TC", TXFECF = "TXFE", IDLECF = "IDLE", ORECF = "ORE", NECF = "NE", FECF = "FE", PECF = "PE", UDRCF = "UDR", WUCF = "WUF" }
source = "RM0481 Rev 5, 56.8.10/56.8.12 USART interrupt and status register (USART_ISR) / USART interrupt flag clear register (USART_ICR); ISR_enabled is the storage owner the SVD's ISR_disabled alternate view points at."

[[cross]]
ip = "UART"
reg = "USART_ICR"
target_reg = "USART_ISR_enabled"
effect = "clear"
pairs = { CMCF = "CMF", EOBCF = "EOBF", RTOCF = "RTOF", CTSCF = "CTSIF", LBDCF = "LBDF", TCBGTCF = "TCBGT", TCCF = "TC", TXFECF = "TXFE", IDLECF = "IDLE", ORECF = "ORE", NECF = "NE", FECF = "FE", PECF = "PE", UDRCF = "UDR", WUCF = "WUF" }
source = "RM0481 Rev 5, 56.8.10/56.8.12, the same shared USART/UART chapter as the USART-keyed rule above; UART4, UART5, UART7 to UART9 and UART12 are a different db IP (UART, not USART) with the same ISR/ICR layout in the SVD."

[[cross]]
ip = "LPUART"
reg = "LPUART_ICR"
target_reg = "LPUART_ISR_enabled"
effect = "clear"
pairs = { CMCF = "CMF", CTSCF = "CTSIF", TCCF = "TC", IDLECF = "IDLE", ORECF = "ORE", NECF = "NE", FECF = "FE", PECF = "PE", WUCF = "WUF" }
source = "RM0481 Rev 5, 57.7.8 LPUART interrupt and status register (LPUART_ISR) / 57.7.10 LPUART interrupt flag clear register (LPUART_ICR): a reduced set versus USART_ICR."

[[cross]]
instances = ["UCPD1"]
reg = "UCPD_ICR"
target_reg = "UCPD_SR"
effect = "clear"
pairs = { FRSEVTCF = "FRSEVT", TYPECEVT2CF = "TYPECEVT2", TYPECEVT1CF = "TYPECEVT1", RXMSGENDCF = "RXMSGEND", RXOVRCF = "RXOVR", RXHRSTDETCF = "RXHRSTDET", RXORDDETCF = "RXORDDET", TXUNDCF = "TXUND", HRSTSENTCF = "HRSTSENT", HRSTDISCCF = "HRSTDISC", TXMSGABTCF = "TXMSGABT", TXMSGSENTCF = "TXMSGSENT", TXMSGDISCCF = "TXMSGDISC" }
source = "RM0481 Rev 5, 62.8.6/62.8.7 UCPD status register (UCPD_SR) / UCPD interrupt clear register (UCPD_ICR)"

[[cross]]
instances = ["FLASH"]
reg = "FLASH_NSCCR"
target_reg = "FLASH_NSSR"
effect = "clear"
pairs = { CLR_EOP = "EOP", CLR_WRPERR = "WRPERR", CLR_PGSERR = "PGSERR", CLR_STRBERR = "STRBERR", CLR_INCERR = "INCERR", CLR_OBKERR = "OBKERR", CLR_OBKWERR = "OBKWERR", CLR_OPTCHANGEERR = "OPTCHANGEERR" }
source = "RM0481 Rev 5, 7.11.9/7.11.13 FLASH nonsecure status register (FLASH_NSSR) / FLASH nonsecure clear control register (FLASH_NSCCR): a write of 1 to CLR_x clears the NSSR flag"

[[registers]]
peripheral = "GPIOI"
name = "GPIOI_AFRH"
offset = 0x024
width = 32
reset = 0
acc = "read_write"
fields = [{ name = "AFSEL8", lsb = 0, width = 4 }, { name = "AFSEL9", lsb = 4, width = 4 }, { name = "AFSEL10", lsb = 8, width = 4 }, { name = "AFSEL11", lsb = 12, width = 4 }]
source = "Silicon read-back on two STM32H573 parts over SWD, 2026-10-27: GPIOI_AFRH at 0x42022024 takes 0x0000D5A1 and returns it, 0xFFFFFFFF returns 0x0000FFFF, so AFSEL8 to AFSEL11 exist and bits 31:16 read 0. DS14121 Rev 5, Table 17 lists PI11 AF13 PSSI_D15. RM0481 Rev 5, 13.4.10 limits GPIOx_AFRH to x = A to H and the STM32H5 SVDs have no GPIOI_AFRH"


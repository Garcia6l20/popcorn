[[resets]]
peripheral = "FLASH"
register = "FLASH_HDP2R_CUR"
reset = 0x00000001
source = "RM0481 Rev 5, 7.11.52 FLASH_HDP2R_CUR: reset value 0xXXXX XXXX, loaded from the option bytes. Delivery value of Table 55: HDP2_STRT 1, HDP2_END 0, no HDP area. ST's STM32H573 SVD gives 0"

[memory]
source = "RM0481 Rev 5, 7.3.9: the 2048-byte OTP area at 0x08FF F000 to 0x08FF F7FF, written once in 16-bit units through the flash interface and read-only to the CPU, and the read-only area at 0x08FF F800 to 0x08FF FFFF that holds the device signature, 67.1 to 67.3. 7.3.10: the high-cycle data area at 0x0900 0000 to 0x0901 7FFF is a plain read-only region here, with no controller, since EDATA programming is not modelled. 7.3.5 to 7.3.8: flash is programmed by stores into the main memory range through the FLASH interface, so FLASH controls both flash windows. OTP programming is not modelled"
controller = { Flash_NS = "FLASH", Flash_S = "FLASH" }
add = [
  { name = "OTP_NS", start = 0x08FFF000, size = 0x800, kind = "rom", acc = { read = true, write = false, execute = false }, secure = false },
  { name = "RO_NS", start = 0x08FFF800, size = 0x800, kind = "rom", acc = { read = true, write = false, execute = false }, secure = false },
]

[signature]
source = "RM0481 Rev 5, 67.1 unique device ID at 0x08FF F800, 96 bits, here a fixed value: wafer coordinates 0x00320014, wafer 1, lot POPCORN in ASCII. 67.2 flash size data register at 0x08FF F80C, FLASH_SIZE in KB from the CubeMX part. 67.3 package data register at 0x08FF F80E, PKG[5:0] from the table of 67.3 keyed by the CubeMX package, SMPS for a part name ending in Q, UFBGA169 is 0b00110, a package absent from that table leaves the register erased. DS14121 Rev 5, Table 28 and Table 102: factory calibration words, raw 12-bit ADC codes at VDDA = 3.3 V, here typical values as V / 3.3 V x (2^12 - 1), rounded: VREFINT_CAL at 0x08FF F810, VREFINT 1.216 V (Table 27) = 1509 = 0x05E5. TS_CAL1 at 0x08FF F814, 30 C, V30 0.62 V (Table 101) = 769 = 0x0301. TS_CAL2 at 0x08FF F818, 130 C, 0.62 V + 100 x 2 mV/C Avg_Slope = 0.82 V = 1018 = 0x03FA"
region = "RO_NS"
package = 0x00E
uid = 0x000
flash_size = 0x00C
uid_words = [0x0032_0014, 0x4F52_4E01, 0x504F_5043]
content = [
  { offset = 0x010, data = [0xE5, 0x05] },
  { offset = 0x014, data = [0x01, 0x03] },
  { offset = 0x018, data = [0xFA, 0x03] },
]
packages = { "LQFP64" = 0x00, "WLCSP63" = 0x00, "VFQFPN68" = 0x01, "LQFP100" = 0x02, "UFBGA176+25" = 0x03, "LQFP144" = 0x04, "LQFP48" = 0x05, "UFBGA169" = 0x06, "LQFP176" = 0x07, "LQFP100 SMPS" = 0x0A, "UFBGA176+25 SMPS" = 0x0B, "LQFP144 SMPS" = 0x0C, "LQFP176 SMPS" = 0x0D, "UFBGA169 SMPS" = 0x0E, "UFQFPN48" = 0x10, "WLCSP39" = 0x11, "LQFP80" = 0x12, "UFBGA100" = 0x14, "UFBGA144" = 0x15, "LQFP144-EP" = 0x17, "LQFP100-EP" = 0x1E }


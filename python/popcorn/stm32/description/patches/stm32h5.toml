format = 1
source = "RM0481 Rev 5 and STM32H573 CubeMX db: SVD naming against CubeMX instances. IRQ adds: RM0481 Rev 5, 17.3 Table 152 STM32H562/563/573xx vector table lists PVD_AVD 1, RTC 2, RTC_S 3, FPU 103 and CEC 119, which STM32H573.svd lacks and the CMSIS IRQn_Type defines. PVD_AVD and FPU go to EXTI as the U5 SVD places PVD_PVM and FPU. The RTC lines go to RTC. HDMI-CEC is an unmodelled H5 block with no peripheral in the SVD, so CEC goes to EXTI too. IRQ rename: the SVD names IRQ 105 DCACHE, RM0481 Rev 5, 17.3 Table 152 names it DCACHE1 and the CMSIS IRQn_Type DCACHE1_IRQn, so it is dropped and added again under that name at the same number, which gives the same line name with and without the CMSIS header"

[match]
parts = ["STM32H5*"]
svd = ["STM32H5*.svd"]

[peripherals]
drop = ["SEC_LPUART1"]
source = "STM32H573.svd derives SEC_LPUART1 from LPUART, not LPUART1, so the alias rule finds no base. RM0481 Rev 5, 2.3: the secure LPUART1 window is NS base + 0x1000_0000, unused under TZEN=0, D4"

[aliases]
prefix = "SEC_"
offset = 0x10000000
source = "RM0481 Rev 5, 2.3 memory map: secure peripheral alias at NS base + 0x1000_0000"

[ip]
renames = { DCACHE1 = ["DCACHE"], LPUART1 = ["LPUART"], DAC1 = ["DAC"], OCTOSPI1 = ["OCTOSPI"], I3C1 = ["I3C"], GPIO = ["GPIOA", "GPIOB", "GPIOC", "GPIOD", "GPIOE", "GPIOF", "GPIOG", "GPIOH", "GPIOI"], GTZC = ["GTZC1_TZSC", "GTZC1_TZIC"], GTZC_NS = ["GTZC1_MPCBB1", "GTZC1_MPCBB2", "GTZC1_MPCBB3"] }

[irqs]
drop = ["DCACHE"]
add = [
  { number = 105, name = "DCACHE1", peripheral = "DCACHE" },
  { number = 1, name = "PVD_AVD", peripheral = "EXTI" },
  { number = 2, name = "RTC", peripheral = "RTC" },
  { number = 3, name = "RTC_S", peripheral = "RTC" },
  { number = 103, name = "FPU", peripheral = "EXTI" },
  { number = 119, name = "CEC", peripheral = "EXTI" },
]

[core]
reset_clock_hz = 32_000_000
source = "RM0481 Rev 5, 11.8.1 RCC_CR HSIDIV reset 01, hsi_ck 32 MHz, SYSCLK after reset"

[[peripheral_sizes]]
peripheral = "USB"
size = 0xC00
source = "RM0481 Rev 5, 2.3: USB_FS RAM 0x40016400 to 0x40016BFF follows the registers"

[[fields]]
instances = ["EXTI"]
registers = ["EXTI_RPR1"]
fields = ["RPIF0", "RPIF1", "RPIF2", "RPIF3", "RPIF4", "RPIF5", "RPIF6", "RPIF7", "RPIF8", "RPIF9", "RPIF10", "RPIF11", "RPIF12", "RPIF13", "RPIF14", "RPIF15", "RPIF16"]
on_write = "one_to_clear"
source = "RM0481 Rev 5, 18.7.4 EXTI rising edge pending register (EXTI_RPR1): RPIF0 to RPIF16 are cleared by writing 1. ST's STM32H573 SVD gives plain read-write"

[[fields]]
instances = ["EXTI"]
registers = ["EXTI_FPR1"]
fields = ["FPIF0", "FPIF1", "FPIF2", "FPIF3", "FPIF4", "FPIF5", "FPIF6", "FPIF7", "FPIF8", "FPIF9", "FPIF10", "FPIF11", "FPIF12", "FPIF13", "FPIF14", "FPIF15", "FPIF16"]
on_write = "one_to_clear"
source = "RM0481 Rev 5, 18.7.5 EXTI falling edge pending register (EXTI_FPR1): FPIF0 to FPIF16 are cleared by writing 1. ST's STM32H573 SVD gives plain read-write"

[[fields]]
instances = ["EXTI"]
registers = ["EXTI_RPR2"]
fields = ["RPIF46", "RPIF50", "RPIF53"]
on_write = "one_to_clear"
source = "RM0481 Rev 5, 18.7.11 EXTI rising edge pending register 2 (EXTI_RPR2): RPIF46, RPIF50 and RPIF53 are cleared by writing 1. ST's STM32H573 SVD gives plain read-write"

[[fields]]
instances = ["EXTI"]
registers = ["EXTI_FPR2"]
fields = ["FPIF46", "FPIF50", "FPIF53"]
on_write = "one_to_clear"
source = "RM0481 Rev 5, 18.7.12 EXTI falling edge pending register 2 (EXTI_FPR2): FPIF46, FPIF50 and FPIF53 are cleared by writing 1. ST's STM32H573 SVD gives plain read-write"

[[fields]]
ip = "I2C"
registers = ["I2C_ISR"]
fields = ["TXIS", "TXE"]
on_write = "one_to_set"
source = "RM0481 Rev 5, 53.9.7 I2C interrupt and status register (I2C_ISR): TXIS and TXE are rs, software sets them to force a transmit event or flush TXDR, not a clear"

[[fields]]
instances = ["RNG"]
registers = ["RNG_SR"]
fields = ["SEIS", "CEIS"]
on_write = "zero_to_clear"
source = "RM0481 Rev 5, 36.7.2 RNG status register (RNG_SR): SEIS and CEIS are rc_w0, writing 1 has no effect. ST's STM32H573 SVD gives plain read-write"

[[fields]]
instances = ["HASH"]
registers = ["HASH_SR"]
fields = ["NBWE", "NBWP"]
width = 6
source = "RM0481 Rev 5, 40.6.6 HASH status register (HASH_SR): NBWE[5:0] in bits 21:16 and NBWP[5:0] in bits 14:9. ST's STM32H573 SVD gives 5 bits each, and SHA3-224 needs NBWE 37"

[[cross]]
ip = "GPDMA"
reg = "GPDMA_C{n}FCR"
target_reg = "GPDMA_C{n}SR"
each = { n = [0, 7] }
effect = "clear"
pairs = { TCF = "TCF", HTF = "HTF", DTEF = "DTEF", ULEF = "ULEF", USEF = "USEF", SUSPF = "SUSPF", TOF = "TOF" }
source = "RM0481 Rev 5, 16.8.7/16.8.8 GPDMA channel x flag clear register / status register, one shared layout for channels 0 to 7 of GPDMA1 and GPDMA2"

[[cross]]
ip = "I2C"
reg = "I2C_ICR"
target_reg = "I2C_ISR"
effect = "clear"
pairs = { ALERTCF = "ALERT", TIMOUTCF = "TIMEOUT", PECCF = "PECERR", OVRCF = "OVR", ARLOCF = "ARLO", BERRCF = "BERR", STOPCF = "STOPF", NACKCF = "NACKF", ADDRCF = "ADDR" }
source = "RM0481 Rev 5, 53.9.7/53.9.8 I2C interrupt and status register (I2C_ISR) / I2C interrupt clear register (I2C_ICR)"

[[cross]]
instances = ["RCC"]
reg = "RCC_CICR"
target_reg = "RCC_CIFR"
effect = "clear"
pairs = { LSIRDYC = "LSIRDYF", LSERDYC = "LSERDYF", CSIRDYC = "CSIRDYF", HSIRDYC = "HSIRDYF", HSERDYC = "HSERDYF", HSI48RDYC = "HSI48RDYF", PLL1RDYC = "PLL1RDYF", PLL2RDYC = "PLL2RDYF", PLL3RDYC = "PLL3RDYF", HSECSSC = "HSECSSF" }
source = "RM0481 Rev 5, 11.8.17/11.8.18 RCC clock source interrupt flag register (RCC_CIFR) / RCC clock source interrupt clear register (RCC_CICR)"

[[cross]]

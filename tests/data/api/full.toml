[project]
name = "demo"

[mcu]
part = "POPCORN-M33-TEST"
description = "../core/m33.json"
ioc = "cubemx/demo.ioc"

[image.app]
elf = "../../firmware/api/prebuilt/driver.elf"

[image.boot]
bin = "blob.bin"
at = 0x2000_0100

[boot]
vtor = 0x0800_0000
until = "alu_mark"
budget = 1_000_000
memory_init = [{ symbol = "spin_flag", bytes = "01000000" }]

[clock]
core_hz = 8_000_000
cpi = 1.0

[board.UART4]
connect = "pty"

[board.I2C1]
devices = [
  { address = 0x50, model = "fake_models:Eeprom", size = 8192 },
]

[board.TIM2]
model = "fake_models:Timer"
prescaler = 4

[models]
strict = true
python = ["models"]

[configs.variant]
mcu.ioc = "cubemx/variant.ioc"
image.app.elf = "../../firmware/core/prebuilt/basic.elf"

[configs.broken]
image.app.elff = "x.elf"

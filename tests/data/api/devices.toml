[project]
name = "devices"

[mcu]
part = "STM32U575QGIx"

[image.app]
elf = "../../firmware/periph/prebuilt/i2c_ll.elf"

[boot]
until = "main"
budget = 100_000_000

[board.I2C1]
devices = [
  { address = 0x50, model = "api.devices_example:Eeprom24", size = 4096 },
]

[models]
python = ["../../python"]

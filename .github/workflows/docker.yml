name: docker

on:
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - .gitmodules
      - pyproject.toml
      - deps.toml
      - pcons-build.py
      - popcorn_build/**
      - python/**
      - native/**
      - third_party/**
      - LICENSE
      - NOTICE
      - LICENSES/**
      - examples/**
      - tests/docs/guide/test_first_machine.py
      - .github/workflows/docker.yml
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/garcia6l20/popcorn
  LOCAL_TAG: popcorn:ci

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Read the project version
        id: version
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_OUTPUT"
          echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag names the project version
        if: github.ref_type == 'tag'
        run: |
          python3 -m venv "$RUNNER_TEMP/tag-check"
          "$RUNNER_TEMP/tag-check/bin/pip" install -q packaging==26.3
          "$RUNNER_TEMP/tag-check/bin/python" - <<'EOF'
          import os
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          try:
              matches = tag.startswith("v") and Version(tag[1:]) == Version(project)
          except InvalidVersion:
              matches = False
          if not matches:
              sys.exit(f"tag {tag} does not name the pyproject version {project}")
          print(f"tag {tag} names version {project}")
          EOF

      - name: Decide whether the tag is a final release
        id: ref
        run: |
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "exact=true" >> "$GITHUB_OUTPUT"
          else
            echo "exact=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.ref.outputs.exact == 'true' }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            JOBS=${{ steps.version.outputs.jobs }}
            POPCORN_REVISION=${{ github.sha }}
            POPCORN_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: docker/smoke.sh "$LOCAL_TAG"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JOBS=${{ steps.version.outputs.jobs }}
            POPCORN_REVISION=${{ github.sha }}
            POPCORN_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Check that the pushed image is the smoke-tested one
        if: github.event_name == 'push'
        env:
          TESTED: ${{ steps.build.outputs.imageid }}
          PUSHED: ${{ steps.push.outputs.imageid }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tested $TESTED, pushed $PUSHED"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | python3 -c '
          import json
          import os
          import sys

          tested = os.environ["TESTED"]
          pushed = os.environ["PUSHED"]
          index = json.load(sys.stdin)
          amd64 = [
              m["digest"]
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("architecture") == "amd64"
          ]
          if not tested or (tested != pushed and amd64 != [tested]):
              sys.exit(f"pushed image {amd64 or pushed} is not the tested {tested}")
          print(f"pushed image holds the tested manifest {tested}")
          '
          {
            echo "Pushed $DIGEST"
            echo
            echo "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

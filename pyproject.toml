[build-system]
requires = ["pcons==0.31.0"]
build-backend = "pcons.pyproject"

[project]
name = "popcorn"
version = "0.1.0.dev0"
requires-python = ">=3.14"
license = "MIT AND GPL-2.0-only AND LGPL-2.1-or-later AND BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
dependencies = [
    "pyelftools",
]

[project.optional-dependencies]
pytest = [
    "pytest>=9.1",
]
plugin = [
    "pcons==0.31.0",
    "ninja",
]

[project.entry-points.pytest11]
"popcorn.pytest" = "popcorn.pytest"

[dependency-groups]
dev = [
    "pcons",
    "pytest",
    "pyright",
    "ruff",
    "black",
    "jsonschema",
    "gcovr==8.8",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
]
docs = [
    "mkdocstrings-python==2.0.10",
    "zensical==0.0.71",
]

[tool.pcons]
variant = "release"
variables = { POPCORN_BUILD_TESTS = "OFF", POPCORN_BUILD_EXAMPLES = "OFF" }

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["local", "build", "build-*", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "^/(local|build[^/]*|third_party)/"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["python", "tests/python", "tests/docs", "examples", "popcorn_build"]
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "popcorn_build", extraPaths = ["."], reportMissingTypeStubs = false },
]

[tool.uv]
default-groups = ["dev", "docs"]
no-build-isolation-package = ["popcorn"]

[tool.pytest.ini_options]
timeout = 15
timeout_method = "thread"


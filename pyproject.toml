[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["local", "build", "build-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "^/(local|build[^/]*)/"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["python", "tests/python"]

[build-system]
requires = ["pcons @ git+https://github.com/Garcia6l20/pcons.git@d5be306ae23109cf0b5729da19ebd265308bd4c1"]
build-backend = "pcons.pyproject"

[project]
name = "popcorn"
version = "0.1.0.dev0"
requires-python = ">=3.14"
license = "MIT AND GPL-2.0-only AND LGPL-2.1-or-later AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
dependencies = [
    "pyelftools",
]

[project.optional-dependencies]
pytest = [
    "pytest>=9.1",
]
plugin = [
    "pcons==0.30.0",
    "ninja",
]

[project.entry-points.pytest11]
"popcorn.pytest" = "popcorn.pytest"

[dependency-groups]
dev = [
    "pcons",
    "pytest",
    "pyright",
    "ruff",
    "black",
    "jsonschema",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
]

[tool.pcons]
variant = "release"
variables = { POPCORN_BUILD_TESTS = "OFF", POPCORN_BUILD_EXAMPLES = "OFF" }

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["local", "build", "build-*", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "^/(local|build[^/]*|third_party)/"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["python", "tests/python", "examples", "popcorn_build"]
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "popcorn_build", extraPaths = ["."], reportMissingTypeStubs = false },
]

[tool.uv]
no-build-isolation-package = ["popcorn"]

[tool.uv.sources]
pcons = { git = "https://github.com/Garcia6l20/pcons.git", rev = "devel" }

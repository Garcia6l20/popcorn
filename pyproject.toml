[build-system]
requires = ["pcons==0.29.1"]
build-backend = "pcons.pyproject"

[project]
name = "popcorn"
version = "0.1.0.dev0"
requires-python = ">=3.14"
dependencies = [
    "pyelftools",
]

[dependency-groups]
dev = [
    "pcons==0.29.1",
    "pytest",
    "pyright",
    "ruff",
    "black",
    "jsonschema",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
]

[tool.pcons]
variant = "release"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["local", "build", "build-*", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "^/(local|build[^/]*|third_party)/"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["python", "tests/python"]
venvPath = "."
venv = ".venv"

[tool.uv]
no-build-isolation-package = ["popcorn"]
